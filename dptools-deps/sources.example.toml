schema = 1

# Copy this file to the ignored `sources.local.toml`. Keep only entries whose
# `target` matches the machine staging the release. Paths are packaging inputs,
# never runtime configuration.

[[dependency]]
id = "codex"
family = "provider"
version = "0.145.0"
target = "x86_64-pc-windows-msvc"
source = "C:/private-tools/codex.exe"

[[dependency]]
id = "grok"
family = "provider"
version = "0.2.112"
target = "x86_64-pc-windows-msvc"
source = "C:/private-tools/grok.exe"

[[dependency]]
id = "chromium"
family = "browser"
version = "150.0.7871.129"
target = "x86_64-pc-windows-msvc"
source = "C:/private-tools/chrome-for-testing/chrome-win64"
entrypoint = "chrome.exe"

[[dependency]]
id = "ffmpeg"
family = "media"
version = "8.1.2"
target = "x86_64-pc-windows-msvc"
source = "C:/private-tools/ffmpeg.exe"

# Poppler ships as a TREE (pdftoppm.exe + sibling DLLs + share data); the
# entrypoint names the exe within it. Optional — staging succeeds without it,
# and the app degrades to PATH resolution honestly.
[[dependency]]
id = "pdftoppm"
family = "media"
version = "26.02.0"
target = "x86_64-pc-windows-msvc"
source = "C:/private-tools/poppler-26.02.0"
entrypoint = "Library/bin/pdftoppm.exe"

[[dependency]]
id = "codex"
family = "provider"
version = "0.145.0"
target = "x86_64-unknown-linux-gnu"
source = "/opt/devpulse-private-tools/codex"

[[dependency]]
id = "grok"
family = "provider"
version = "0.2.112"
target = "x86_64-unknown-linux-gnu"
source = "/opt/devpulse-private-tools/grok"

[[dependency]]
id = "chromium"
family = "browser"
version = "150.0.7871.129"
target = "x86_64-unknown-linux-gnu"
source = "/opt/devpulse-private-tools/chrome-for-testing/chrome-linux64"
entrypoint = "chrome"

[[dependency]]
id = "ffmpeg"
family = "media"
version = "8.1.2"
target = "x86_64-unknown-linux-gnu"
source = "/opt/devpulse-private-tools/ffmpeg"
