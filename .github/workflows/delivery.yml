name: delivery

on:
  workflow_run:
    workflows: [green]
    types: [requested, completed]
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  checks: read
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: delivery-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Privileged metadata job: never check out a PR ref or consume its artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Verify delivery decisions offline
        shell: pwsh
        run: ./.github/scripts/delivery.tests.ps1
      - name: Reconcile protected delivery
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/delivery.ps1 -Repository $env:GITHUB_REPOSITORY
