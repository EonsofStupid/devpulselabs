name: green

# The green gate on GITHUB-HOSTED runners.
#
# It ran on self-hosted runners on the estate until 2026-07-30, which was safe
# only while the repo was private and every PR author was the operator. The
# repo went public, and `docs/runbook/ci-runners.md` calls that combination
# non-negotiable: a fork PR would have executed arbitrary code on the estate
# (the Windows runner ran as SYSTEM). Both runners were deregistered and these
# lanes moved to hosted images — exactly the rework that runbook demanded
# before going public.
#
# Hosted minutes are free and unmetered for public repositories, so this also
# ends the single-Windows-runner queue that serialised every merge.
#
# ONE DEFINITION OF GREEN: both lanes run `cargo green` — the same xtask gate
# the pre-push hook enforces locally (fmt → docs-status → spawn audit →
# structure audit → clippy -D warnings → workspace tests → workspace release
# build with the exe-regression assert). Hand-rolled step lists drifted from
# the real gate once already (no structure phase, no release build in CI);
# the lanes now cannot diverge from the hook or from each other.
#
# The toolchain is pinned by `rust-toolchain.toml` (1.92.0 + clippy/rustfmt),
# so the hosted image's preinstalled Rust is overridden automatically — the
# lane cannot silently drift onto a newer compiler.
#
# The Windows lane also PUBLISHES its exe (see `upload the windows exe`). The
# gate's release build was already happening and being discarded; keeping it
# means a green commit on main is a downloadable build, not just a green tick.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"
  # Every commit that reaches main builds, so every commit on main HAS a
  # downloadable Windows exe (see the upload step). Deliberately WITHOUT
  # `paths-ignore`: a docs-only merge produces a byte-identical exe, but it
  # produces one stamped with the new tip SHA, so "grab the artifact for the
  # current main" is always a question with an answer. On a public repo the
  # minutes are free; an operator unable to tell which commit they are running
  # is not.
  push:
    branches: [main]

# A new push supersedes an in-flight run for the same PR. On self-hosted this
# had to be done by hand — stale runs sat in the queue holding the only
# Windows slot.
concurrency:
  group: green-${{ github.workflow }}-${{ github.ref }}
  # ...but NEVER cancel a main build. On a PR the newest push is the only one
  # that matters; on main a cancelled run is a commit with no exe, which is
  # exactly the gap this workflow exists to close.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  green-windows:
    runs-on: windows-latest
    # 90: `cargo green` adds the workspace RELEASE build the old step list
    # skipped; a cold cache pays for it once, warm runs are incremental.
    timeout-minutes: 90
    env:
      # Carried over from the 16 GB self-hosted VM, where cargo test hit
      # LNK1318 "PDB LIMIT" linking big test exes with debug info. Hosted
      # Windows images are also 16 GB, and CI has never needed debug info —
      # local builds keep it. Drop these only with a green run proving it.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          # Hosted runners start cold; the cache is keyed per-job so the two
          # lanes never share artifacts. Release artifacts ride too.
          key: green-windows
          cache-all-crates: "true"
      - name: cargo green (the xtask gate)
        run: cargo green

      # THE EXE THE OPERATOR DOUBLE-CLICKS.
      #
      # `cargo green` already ends in `cargo build --workspace --release`, so
      # by this point both binaries exist — this step costs a zip, not a
      # build. Until now CI compiled them on windows-latest and threw them
      # away, which meant devpulselabs.exe existed in exactly one place on
      # earth: whatever the operator's own machine last built. Work could sit
      # merged on main for days while the running exe predated it, with no way
      # to tell from the app itself.
      #
      # No `if:` — the default is "only on success", and that is the point: an
      # artifact exists ONLY for a commit that passed the gate on this OS.
      #
      # `dpl-lottie-render.exe` ships BESIDE the app, not inside it (ADR-009:
      # the façade spawns it). Shipping the pair keeps the download a working
      # install rather than an app with a missing helper.
      - name: upload the windows exe
        uses: actions/upload-artifact@v7
        with:
          # The SHA is in the NAME so the download answers "which commit is
          # this?" without opening it.
          name: devpulselabs-windows-${{ github.sha }}
          path: |
            target/release/devpulselabs.exe
            target/release/dpl-lottie-render.exe
          # A silent empty artifact would be worse than none — it would look
          # like a delivered build.
          if-no-files-found: error
          retention-days: 30

  green-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # khronos-egl and friends need the full dev set — a runner with only
      # rustup dies at `pkg-config egl` in the first clippy. This is the same
      # list `docs/runbook/linux-runner-bootstrap.sh` installed; keep them in
      # step.
      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake pkg-config ffmpeg libssl-dev \
            libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxtst-dev libxdo-dev libudev-dev libevdev-dev \
            libasound2-dev libpipewire-0.3-dev libdbus-1-dev libgtk-3-dev \
            libgbm-dev libxcb1-dev \
            libpango1.0-dev libcairo2-dev libglib2.0-dev libv4l-dev \
            clang libclang-dev llvm-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: green-linux
          cache-all-crates: "true"
      - name: cargo green (the xtask gate)
        run: cargo green

  # macOS lane — STAGED, ready to flip (docs/plans/mac-parity.md). Hosted
  # `macos-latest` is free for public repos, so this no longer waits on a Mac
  # being registered; it waits on the macOS implementation itself.
  # green-mac:
  #   runs-on: macos-latest
  #   timeout-minutes: 90
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: Swatinem/rust-cache@v2
  #       with:
  #         key: green-mac
  #     - name: cargo green (the xtask gate)
  #       run: cargo green
