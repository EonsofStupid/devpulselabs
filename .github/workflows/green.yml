name: green

# The green gate on SELF-HOSTED runners — zero hosted minutes, native
# targets. Windows lane: dpl-win (this dev laptop). Linux/Wayland lane:
# activates when the Ubuntu mini-PC registers a runner labeled dpl-linux
# (see CLAUDE.md "CI runners"). Free-plan note: checks report on the PR
# but cannot hard-block merges (branch protection is Pro-gated); the
# committed pre-push hook is the local enforcement.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  green-windows:
    runs-on: [self-hosted, dpl-win]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  # Linux/Wayland lane — the ARM64 runner (labels: dpl-linux) is registered
  # and online (dpl-linux-clyffy-lab). Cross-support is a product requirement.
  green-linux:
    runs-on: [self-hosted, dpl-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace
