name: green

# The green gate on SELF-HOSTED runners — zero hosted minutes, native
# targets, both lanes on the dedicated-server estate (CLAUDE.md "CI
# runners"). Windows lane: dpl-win = devpulse-runner-win-01 (Proxmox VM).
# Linux lane: dpl-linux = devpulse-runner-lnx-01 (LXC) + the ARM64
# clyffy-lab runner. Free-plan note: checks report on the PR but cannot
# hard-block merges (branch protection is Pro-gated); the committed
# pre-push hook is the local enforcement.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  green-windows:
    runs-on: [self-hosted, dpl-win]
    # 45: a cold cache (fresh runner) or a debug=0 fingerprint change
    # forces one full rebuild; runs after that are incremental.
    timeout-minutes: 45
    env:
      # A 16GB Windows lane dies on LNK1318 "PDB LIMIT" when cargo test
      # links its big test exes with debug info under memory pressure, and
      # full-parallel builds starve the runner's heartbeat ("lost
      # communication"). CI doesn't need debug info; local builds keep it.
      # The VM boots with 16 GB too — these cures stay.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "8"
    steps:
      - uses: actions/checkout@v7
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  # Linux/Wayland lane — devpulse-runner-lnx-01 (x64 LXC) + the ARM64
  # clyffy-lab runner both carry dpl-linux. Cross-support is a product
  # requirement.
  green-linux:
    runs-on: [self-hosted, dpl-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  # macOS lane — STAGED, ready to flip (docs/plans/mac-parity.md). Uncomment
  # once a Mac runner labeled dpl-mac is registered (a job on a missing label
  # queues forever). The macOS implementation happens on the operator's Mac.
  # green-mac:
  #   runs-on: [self-hosted, dpl-mac]
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: fmt
  #       run: cargo fmt --all --check
  #     - name: clippy (deny warnings)
  #       run: cargo clippy --workspace --all-targets -- -D warnings
  #     - name: tests
  #       run: cargo test --workspace
