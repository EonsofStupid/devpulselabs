name: green

# The green gate on the ESTATE runners (again).
#
# History, because the topology has flipped twice and the WHY must not be
# lost: the lanes ran self-hosted until 2026-07-30, when the repo went
# public and both runners were deregistered the same day — self-hosted on
# `pull_request` is safe ONLY while the repo is private and every PR author
# is the operator (the Windows runner executes as SYSTEM). The lanes moved
# to hosted images for the public month. On 2026-08-07 the repo returned to
# PRIVATE (operator ruling: personal tool), hosted minutes became metered,
# and the estate runners were re-registered from the runbook recipe —
# `docs/runbook/ci-runners.md` — restoring the precondition the security
# rule demands. If the repo ever goes public again: deregister FIRST.
#
# ONE DEFINITION OF GREEN: both lanes run `cargo green` — the same xtask gate
# the pre-push hook enforces locally (fmt → docs-status → spawn audit →
# structure audit → clippy -D warnings → workspace tests → workspace release
# build with the exe-regression assert). Hand-rolled step lists drifted from
# the real gate once already (no structure phase, no release build in CI);
# the lanes now cannot diverge from the hook or from each other.
#
# The toolchain is pinned by `rust-toolchain.toml` (1.97.1 + clippy/rustfmt,
# since #177), so a guest's preinstalled Rust cannot silently become the
# lane's compiler. The bootstrap scripts install an older default toolchain;
# rustup auto-installs the pinned one from the toolchain file on first build.
#
# The Windows lane also PUBLISHES its exe on main (see `upload the windows
# exe`). The gate's release build was already happening and being discarded;
# keeping it means a green commit on main is a downloadable build, not just a
# green tick. PR runs don't upload: nothing downloads a PR's exe, and their
# uploads are what filled the storage quota (2026-10-29).

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"
  # Every commit that reaches main builds, so every commit on main HAS a
  # downloadable Windows exe for a day (see the upload step). Deliberately WITHOUT
  # `paths-ignore`: a docs-only merge produces a byte-identical exe, but it
  # produces one stamped with the new tip SHA, so "grab the artifact for the
  # current main" is always a question with an answer. The estate runners are
  # the operator's own metal, so these runs cost queue time, not minutes.
  push:
    branches: [main]

# A new push supersedes an in-flight run for the same PR — the estate has one
# Windows slot, and stale runs used to sit in the queue holding it.
concurrency:
  group: green-${{ github.workflow }}-${{ github.ref }}
  # ...but NEVER cancel a main build. On a PR the newest push is the only one
  # that matters; on main a cancelled run is a commit with no exe, which is
  # exactly the gap this workflow exists to close.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # CI never benefits from incremental's session folders (each run is a new
  # tree), and they are what makes a persistent cache balloon. Unchanged
  # crates are still reused from the cache below.
  CARGO_INCREMENTAL: "0"

jobs:
  green-windows:
    runs-on: [self-hosted, dpl-win]
    # 90: `cargo green` includes the workspace RELEASE build. A cold run (a
    # new or wiped cache) takes most of an hour on this 16 GB guest; a warm
    # one rebuilds only what changed.
    timeout-minutes: 90
    env:
      # The 16 GB VM's LNK1318 "PDB LIMIT" cures (2026-07-28, each from a
      # real failing run): no debug info in CI test builds, and a bounded
      # job count so the linker isn't starved. Drop these only with a green
      # run on this VM proving they're unneeded.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "8"
    steps:
      - uses: actions/checkout@v7
      # THE BUILD CACHE LIVES OUTSIDE THE CHECKOUT. checkout's `clean: true`
      # runs `git clean -ffdx`, which deleted `target/` before every run
      # ("Removing target/" in every log until 2026-10-24) — so every
      # Windows run rebuilt all ~600 crates twice (tests, then release) and
      # held the one Windows slot for most of an hour. `<workspace>/
      # cargo-target` is a sibling of the checkout: git clean never reaches
      # it, the checkout stays clean, and xtask honours CARGO_TARGET_DIR
      # (`target_dir()`). No rust-cache: the runner's own disk IS the cache.
      # WHERE: a runner with a data disk sets DPL_CI_CACHE_ROOT in its own
      # `.env` (`win-runner-bootstrap.ps1 -DataDisk`), and the cache lives
      # there, off the OS disk, growable with one host command; without it,
      # beside the checkout. Nothing here names a drive, so a new runner is
      # just its own `.env`. The guard wipes it (that run builds cold) past
      # 50 GB or when its disk has under 15 GB free, so a disk never fills.
      - name: the build cache (outside the checkout, guarded)
        shell: powershell
        run: |
          if ($env:DPL_CI_CACHE_ROOT) { $dir = Join-Path $env:DPL_CI_CACHE_ROOT "devpulselabs" }
          else { $dir = Join-Path "${{ runner.workspace }}" "cargo-target" }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "CARGO_TARGET_DIR=$dir`n")
          $free = (Get-PSDrive ((Split-Path -Qualifier $dir).TrimEnd(':'))).Free / 1GB
          if (Test-Path $dir) {
            $size = (Get-ChildItem $dir -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum / 1GB
            "build cache: {0:N1} GB at $dir ({1:N0} GB free)" -f $size, $free
            if ($size -gt 50 -or $free -lt 15) {
              Remove-Item $dir -Recurse -Force
              "build cache wiped (over 50 GB, or under 15 GB free): this run builds cold"
            }
          } else {
            "build cache: none yet at $dir ({0:N0} GB free): this run builds cold and fills it" -f $free
          }
      - name: cargo green (the xtask gate)
        run: cargo green

      # THE EXE THE OPERATOR DOUBLE-CLICKS.
      #
      # `cargo green` already ends in `cargo build --workspace --release`, so
      # by this point both binaries exist — this step costs a zip, not a
      # build. Until now CI compiled them and threw them away, which meant
      # devpulselabs.exe existed in exactly one place on earth: whatever the
      # operator's own machine last built. Work could sit merged on main for
      # days while the running exe predated it, with no way to tell from the
      # app itself.
      #
      # MAIN ONLY: pushes to main and a dispatch run on main upload; PR runs
      # (`refs/pull/…`) skip it. An `if:` without a status function still
      # implies `success()`, and that is the point: an artifact exists ONLY
      # for a commit that passed the gate on this OS.
      #
      # `dpl-lottie-render.exe` ships BESIDE the app, not inside it (ADR-009:
      # the façade spawns it). Shipping the pair keeps the download a working
      # install rather than an app with a missing helper.
      - name: upload the windows exe
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          # The SHA is in the NAME so the download answers "which commit is
          # this?" without opening it.
          name: devpulselabs-windows-${{ github.sha }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/devpulselabs.exe
            ${{ env.CARGO_TARGET_DIR }}/release/dpl-lottie-render.exe
          # A silent empty artifact would be worse than none — it would look
          # like a delivered build.
          if-no-files-found: error
          # Private-repo artifact storage is quota'd (500 MB shared by the
          # account's private repos), billed by average use over the month.
          # 3 days with PR uploads (~7 a day × 27 MB) went over it on
          # 2026-10-29, and deleting didn't help until the month reset. 1 day
          # from main only stays well under it and still answers "grab the
          # current main exe".
          retention-days: 1

  green-linux:
    runs-on: [self-hosted, dpl-linux]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The dev deps (khronos-egl and friends) are BAKED into the guest by
      # `docs/runbook/linux-runner-bootstrap.sh` — the runner user has no
      # sudo, by design. This step only proves the bake is intact so a
      # hollow guest fails loudly here instead of mysteriously in clippy.
      - name: system deps are baked (verify, no sudo)
        run: pkg-config --exists egl && ffmpeg -version | head -1
      # The build cache, outside the checkout — see green-windows.
      - name: the build cache (outside the checkout, guarded)
        run: |
          if [ -n "${DPL_CI_CACHE_ROOT:-}" ]; then dir="$DPL_CI_CACHE_ROOT/devpulselabs"
          else dir="${{ runner.workspace }}/cargo-target"; fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$dir")"
          free_gb=$(( $(df -Pk "$(dirname "$dir")" | awk 'NR==2 {print $4}') / 1048576 ))
          if [ -d "$dir" ]; then
            size_gb=$(( $(du -sk "$dir" | cut -f1) / 1048576 ))
            echo "build cache: ${size_gb} GB at $dir (${free_gb} GB free)"
            if [ "$size_gb" -gt 50 ] || [ "$free_gb" -lt 15 ]; then
              rm -rf "$dir"
              echo "build cache wiped (over 50 GB, or under 15 GB free): this run builds cold"
            fi
          else
            echo "build cache: none yet at $dir (${free_gb} GB free): this run builds cold and fills it"
          fi
      - name: cargo green (the xtask gate)
        run: cargo green

  # macOS lane — STAGED, ready to flip (docs/plans/mac-parity.md). No Mac is
  # registered on the estate, and flipping this on now would also mean paying
  # hosted macOS minutes on a private repo. It waits on the macOS
  # implementation itself either way.
  # green-mac:
  #   runs-on: macos-latest
  #   timeout-minutes: 90
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: Swatinem/rust-cache@v2
  #       with:
  #         key: green-mac
  #     - name: cargo green (the xtask gate)
  #       run: cargo green
