name: green

# Public-repository CI runs only on disposable GitHub-hosted machines.
# Estate registrations must stay removed; see docs/runbook/ci-runners.md.
# Both platforms run the same cargo green gate as the local pre-push hook.
# rust-toolchain.toml pins the compiler, clippy, rustfmt and wasm target.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  # Every main commit gets its own downloadable Windows build.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: green-${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs, but preserve every main commit's artifact.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  green-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      # Keep the established PDB/linker memory bounds for the complete gate.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: verify hosted Windows build prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msvc = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $msvc) { throw "MSVC x64 build tools are missing" }
          $clang = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $clang "libclang.dll"))) { throw "LLVM libclang.dll is missing" }
          "LIBCLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Activate the repository's pinned toolchain before computing cache keys.
          $rustInfo = rustc -vV
          if ($LASTEXITCODE -ne 0) { throw "Pinned Rust toolchain installation failed" }
          $rustInfo
          if ($rustInfo -notcontains "host: x86_64-pc-windows-msvc") { throw "The Rust host must use x64 MSVC" }
          $sysroot = rustc --print sysroot
          if ($LASTEXITCODE -ne 0) { throw "Rust sysroot lookup failed" }
          $linker = Join-Path $sysroot "lib\rustlib\x86_64-pc-windows-msvc\bin\rust-lld.exe"
          if (-not (Test-Path $linker)) { throw "The pinned toolchain's rust-lld.exe is missing" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: green-windows-2025
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo green (the xtask gate)
        run: cargo green
      # Upload only after the complete gate passes. The helper must ship beside
      # the app (ADR-009); missing artifacts or upload failures remain failures.
      - name: upload the windows exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: devpulselabs-windows-${{ github.sha }}
          path: |
            target/release/devpulselabs.exe
            target/release/dpl-lottie-render.exe
          if-no-files-found: error
          retention-days: 3

  green-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Same native development dependencies as nightly and the Linux bootstrap;
      # never register or connect an estate runner from this public workflow.
      - name: install Linux build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake pkg-config ffmpeg libssl-dev \
            libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxtst-dev libxdo-dev libudev-dev libevdev-dev \
            libasound2-dev libpipewire-0.3-dev libdbus-1-dev libgtk-3-dev \
            libgbm-dev libxcb1-dev \
            libpango1.0-dev libcairo2-dev libglib2.0-dev libv4l-dev \
            clang libclang-dev llvm-dev
          pkg-config --exists egl
          ffmpeg -version
      - name: activate the pinned Rust toolchain
        run: rustc -vV
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: green-linux-24.04
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo green (the xtask gate)
        run: cargo green

  # macOS remains staged until its implementation passes docs/plans/mac-parity.md.
