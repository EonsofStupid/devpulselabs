# Dependabot — Cargo crate graph + Actions pin freshness.
# Alerts/security updates are enabled on the repo; this file drives version PRs.
# One grouped PR per ecosystem per month (R296): a PR per crate cost a full CI
# run each, and crates that must move together, like arrow and parquet, failed
# when updated apart. Security updates still open as soon as an alert appears.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      time: "08:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    target-branch: main
    labels:
      - dependencies
      - cargo
    groups:
      cargo-all:
        applies-to: version-updates
        patterns:
          - "*"
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "08:15"
      timezone: America/New_York
    open-pull-requests-limit: 2
    target-branch: main
    labels:
      - dependencies
      - github-actions
    groups:
      actions-all:
        patterns:
          - "*"
