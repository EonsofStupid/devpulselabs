    "crates/egui-pilot-ai-cli",
    "crates/egui-pilot-ai-lab",
    "crates/chat/core",
    "crates/chat/accounts",
    "crates/chat/browser-auth",
    "crates/chat/context",
    "crates/chat/extensions",
    "crates/chat/imagine",
    "crates/chat/interactions",
    "crates/chat/profiles",
    "crates/chat/renderers",
    "crates/chat/runtime",
    "crates/chat/social",
    "crates/chat/store",
    "crates/chat/testkit",
    "crates/chat/window",
    "crates/chat/windows",
    "crates/chat/providers/codex",
    "crates/chat/providers/claude",
    "crates/chat/providers/gemini",
    "crates/chat/providers/grok",
    "crates/tools-deps",
    "crates/hub",
    "crates/coldlight",
    "crates/vector",
    "crates/video",
    "crates/backdrop",
    "crates/engine-capture",
    "crates/engine-media",
    "crates/engine-steps",
    "crates/engine-ae",
    "crates/engine-browser",
    "crates/lottie",
    "crates/lottie-render",
    "crates/slides",
    "crates/doc",
    "crates/proc",
    "crates/comp",
    "crates/workflows",
    "crates/guide",
    "crates/composer",
    "crates/editor",
    "crates/deck",
    "crates/index",
    "crates/estate",
    "crates/viziwiz",
    "crates/fabric",
    "crates/landing",
    "crates/seam",
    "crates/shell",
    "crates/hubs/home",
    "crates/hubs/shows",
    "crates/hubs/present",
    "crates/hubs/workbench",
    "crates/hubs/wiredfront",
    "crates/app",
    "crates/xtask",
]

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# The whole default clippy set rides the gate (-D warnings turns these hard).
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
egui = "0.35"
eframe = { version = "0.35", features = ["wgpu"] }
egui-wgpu = "0.35"
# "file" installs the file:// loader (without it every Media::Image errors);
# "webp" adds animated-webp support on top of the image crate's static decode.
egui_extras = { version = "0.35", features = ["image", "file", "webp"] }
# Headless UI test harness (dev-only) Ã¢â‚¬â€ MUST track the egui minor version.
egui_kittest = { version = "0.35", default-features = false }
# The document layer (dpl-doc): slide.json is serde data, end to end.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ADR-011: the ONE outbound HTTPS client, used only by dpl-chat-imagine's
# bounded worker against the compiled-in xAI Imagine endpoint.
ureq = "2"
data-encoding = "2"
# The per-project estate: Fjall = embedded LSM KV (persistence), Moka =
# concurrent in-process cache (the hot-read layer). Pure Rust, no server.
fjall = "2"
moka = { version = "0.12", features = ["sync"] }
sha2 = "0.11"
agent-client-protocol = "=2.0.0"
async-channel = "2"
async-io = "2"
async-process = "2"
futures-lite = "2"
# The mogrt reader (R2a.2, operator-ratified): .mogrt is a plain zip.
zip = { version = "8", default-features = false, features = ["deflate"] }
# The AEP orchestrator's capability probe (operator-ratified): read total
# RAM cross-platform so the aerender tuning scales 16GB→128GB. "system"
# feature only — no disk/network/component probing.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# ThorVG (C++, vendored) — the native Lottie engine, linked ONLY by the
# dpl-lottie-render subprocess helper (ADR-009 FFI leaf), never by the app.
thorvg-sys = "0.3"
# The browser driver's CDP socket (ADR-013): pure-Rust WebSocket framing
# over OUR TcpStream, localhost only — no TLS features, ever.
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
toml = "1.1"
tokio = { version = "1", default-features = false, features = ["sync"] }
turso = "0.7"
# The agent seam (R1v): localhost HTTP over the fabric — axum is the
# operator-ratified server; tokio-stream folds broadcast → SSE; tower is
# dev-only endpoint testing (oneshot, no sockets).
axum = "0.8"
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tower = "0.5"
# png for the harness; jpeg for the backdrop posters (B1); webp so the app
# DISPLAYS what the media pipeline emits (B3). AVIF decode is deliberately
# absent Ã¢â‚¬â€ the pipeline always writes a webp sibling for display.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Human provider authentication opens only through the OS default-browser
# service. `hardened` rejects every non-HTTP(S) target before platform launch.
webbrowser = { version = "1.2", default-features = false, features = ["hardened"] }

egui-pilot-ai-protocol = { path = "crates/egui-pilot-ai-protocol" }
egui-pilot-ai-transport = { path = "crates/egui-pilot-ai-transport" }
egui-pilot-ai = { path = "crates/egui-pilot-ai" }
egui-pilot-ai-runtime = { path = "crates/egui-pilot-ai-runtime" }
egui-pilot-ai-runner = { path = "crates/egui-pilot-ai-runner" }
egui-pilot-ai-lab = { path = "crates/egui-pilot-ai-lab" }

