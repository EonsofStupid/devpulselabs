# The Windows MSVC linker otherwise exhausts its PDB record limit while
# linking the workspace test graph (notably the ACP-backed provider tests).
# Tests still compile and run in full; only their debug-symbol payload is
# omitted so `cargo green` remains a reliable local gate.
[profile.test]
debug = 0

[profile.release]
lto = "thin"

# Dev runs must be USABLE: dependencies (rav1e, image, wgpu, egui) compile
# once at O2 while our own crates stay fast-iterating at O0.
[profile.dev.package."*"]
opt-level = 2
