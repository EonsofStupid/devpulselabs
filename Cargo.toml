[workspace]
resolver = "2"
members = [
    "crates/egui-pilot-ai-protocol",
    "crates/egui-pilot-ai-transport",
    "crates/egui-pilot-ai",
    "crates/egui-pilot-ai-runtime",
    "crates/egui-pilot-ai-runner",
    "crates/egui-pilot-ai-cli",
    "crates/egui-pilot-ai-lab",
    "crates/chat/core",
    "crates/chat/context",
    "crates/chat/extensions",
    "crates/chat/renderers",
    "crates/chat/runtime",
    "crates/chat/store",
    "crates/chat/testkit",
    "crates/chat/window",
    "crates/chat/windows",
    "crates/chat/providers/codex",
    "crates/chat/providers/claude",
    "crates/chat/providers/gemini",
    "crates/chat/providers/grok",
    "crates/hub",
    "crates/coldlight",
    "crates/vector",
    "crates/video",
    "crates/backdrop",
    "crates/engine-capture",
    "crates/engine-media",
    "crates/engine-steps",
    "crates/slides",
    "crates/doc",
    "crates/comp",
    "crates/guide",
    "crates/composer",
    "crates/editor",
    "crates/deck",
    "crates/index",
    "crates/viziwiz",
    "crates/fabric",
    "crates/seam",
    "crates/shell",
    "crates/hubs/home",
    "crates/hubs/shows",
    "crates/hubs/present",
    "crates/hubs/workbench",
    "crates/hubs/wiredfront",
    "crates/app",
    "crates/xtask",
]

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# The whole default clippy set rides the gate (-D warnings turns these hard).
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
egui = "0.35"
eframe = { version = "0.35", features = ["wgpu"] }
egui-wgpu = "0.35"
# "file" installs the file:// loader (without it every Media::Image errors);
# "webp" adds animated-webp support on top of the image crate's static decode.
egui_extras = { version = "0.35", features = ["image", "file", "webp"] }
# Headless UI test harness (dev-only) Ã¢â‚¬â€ MUST track the egui minor version.
egui_kittest = { version = "0.35", default-features = false }
# The document layer (dpl-doc): slide.json is serde data, end to end.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", default-features = false, features = ["sync"] }
# The agent seam (R1v): localhost HTTP over the fabric — axum is the
# operator-ratified server; tokio-stream folds broadcast → SSE; tower is
# dev-only endpoint testing (oneshot, no sockets).
axum = "0.8"
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tower = "0.5"
# png for the harness; jpeg for the backdrop posters (B1); webp so the app
# DISPLAYS what the media pipeline emits (B3). AVIF decode is deliberately
# absent Ã¢â‚¬â€ the pipeline always writes a webp sibling for display.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

egui-pilot-ai-protocol = { path = "crates/egui-pilot-ai-protocol" }
egui-pilot-ai-transport = { path = "crates/egui-pilot-ai-transport" }
egui-pilot-ai = { path = "crates/egui-pilot-ai" }
egui-pilot-ai-runtime = { path = "crates/egui-pilot-ai-runtime" }
egui-pilot-ai-runner = { path = "crates/egui-pilot-ai-runner" }
egui-pilot-ai-lab = { path = "crates/egui-pilot-ai-lab" }

dpl-chat-core = { path = "crates/chat/core" }
dpl-chat-context = { path = "crates/chat/context" }
dpl-chat-extensions = { path = "crates/chat/extensions" }
dpl-chat-renderers = { path = "crates/chat/renderers" }
dpl-chat-runtime = { path = "crates/chat/runtime" }
dpl-chat-store = { path = "crates/chat/store" }
dpl-chat-testkit = { path = "crates/chat/testkit" }
dpl-chat-window = { path = "crates/chat/window" }
dpl-chat-windows = { path = "crates/chat/windows" }
dpl-chat-codex = { path = "crates/chat/providers/codex" }
dpl-chat-claude = { path = "crates/chat/providers/claude" }
dpl-chat-gemini = { path = "crates/chat/providers/gemini" }
dpl-chat-grok = { path = "crates/chat/providers/grok" }

dpl-hub = { path = "crates/hub" }
dpl-coldlight = { path = "crates/coldlight" }
dpl-vector = { path = "crates/vector" }
dpl-video = { path = "crates/video" }
dpl-backdrop = { path = "crates/backdrop" }
dpl-engine-capture = { path = "crates/engine-capture" }
dpl-engine-media = { path = "crates/engine-media" }
dpl-engine-steps = { path = "crates/engine-steps" }
dpl-slides = { path = "crates/slides" }
dpl-doc = { path = "crates/doc" }
dpl-comp = { path = "crates/comp" }
dpl-guide = { path = "crates/guide" }
dpl-composer = { path = "crates/composer" }
dpl-editor = { path = "crates/editor" }
dpl-deck = { path = "crates/deck" }
dpl-index = { path = "crates/index" }
dpl-viziwiz = { path = "crates/viziwiz" }
dpl-fabric = { path = "crates/fabric" }
dpl-seam = { path = "crates/seam" }
dpl-shell = { path = "crates/shell" }
dpl-hub-home = { path = "crates/hubs/home" }
dpl-hub-shows = { path = "crates/hubs/shows" }
dpl-hub-present = { path = "crates/hubs/present" }
dpl-hub-workbench = { path = "crates/hubs/workbench" }
dpl-hub-wiredfront = { path = "crates/hubs/wiredfront" }

[profile.release]
lto = "thin"

# Dev runs must be USABLE: dependencies (rav1e, image, wgpu, egui) compile
# once at O2 while our own crates stay fast-iterating at O0.
[profile.dev.package."*"]
opt-level = 2
