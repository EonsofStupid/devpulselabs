[alias]
# Conventional cargo-xtask entry point used by local docs and CI diagnostics.
xtask = "run -p xtask --"
# THE gate: fmt-check + clippy(-D warnings) + tests + release build with exe-mtime assert.
green = "run -p xtask --release --"
gate = "clippy --workspace --all-targets -- -D warnings"
test-all = "test --workspace"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
