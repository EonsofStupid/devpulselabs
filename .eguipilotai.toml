# Assist-mode persistence: the REAL chat runtime on scratch rings, so the
# blanket consent writes a real assist-policy.json that the paired
# `chat-assist-persists` scenario proves survives a fresh launch.
[fixtures.chat-assist-real]
arguments = ["--chat-open", "--mood", "0"]

[fixtures.chat-assist-real.environment]
CONTENT_ROOT = "target/eguipilotai/assist-rings/content"
ASSETS_ROOT = "target/eguipilotai/assist-rings/assets"
USERDATA_ROOT = "target/eguipilotai/assist-rings/.userdata"

# A scratch content root: without one this fixture ran against the
# operator's real content (every launch upgrades and Studio places into it).
[fixtures.workbench-studio]
arguments = ["--route", "workbench/studio", "--mood", "0"]

[fixtures.workbench-studio.environment]
CONTENT_ROOT = "target/eguipilotai/studio/content"

[[projects]]
id = "devpulse-cloud"
profile = "devpulse-cloud"
adapter_policy = "software-required"
required = true
workers = 1
retries = 0

[[projects]]
id = "devpulse-hardware"
profile = "devpulse-hardware"
adapter_policy = "hardware-required"
required = false
workers = 1
retries = 0

# The job board over a SCRATCH content root: the scenario taps Run on the
# storyboard workflow, which publishes one job per stage that no route
# clears, so the board has real rows. (No `--run-workflow` here: that drill
# prints its verdict to stdout, which is the pilot transport.) Maximized and
# the 1100x700 minimum are the ColdLight gate's two sizes.
[fixtures.jobs-board]
arguments = ["--route", "wiredfront/editor", "--mood", "0"]

[fixtures.jobs-board.environment]
CONTENT_ROOT = "target/eguipilotai/jobs-board/content"

[fixtures.jobs-board-small]
arguments = ["--route", "wiredfront/editor", "--mood", "0", "--window", "1100x700"]

[fixtures.jobs-board-small.environment]
CONTENT_ROOT = "target/eguipilotai/jobs-board-small/content"
