artifact_root = "target/eguipilotai/runs"

[profiles.devpulse-windows]
executable = "target/debug/devpulselabs.exe"
platforms = ["windows"]
arguments = []
adapter_policy = "hardware-then-software"
timeout_ms = 30000

[profiles.devpulse-windows.environment]
EGUIPILOTAI_ADAPTER_POLICY = "hardware-then-software"

[profiles.devpulse-cloud]
executable = "target/debug/devpulselabs"
platforms = ["linux"]
arguments = []
adapter_policy = "software-required"
timeout_ms = 45000

[profiles.devpulse-cloud.environment]
EGUIPILOTAI_ADAPTER_POLICY = "software-required"
WGPU_BACKEND = "vulkan"
VK_DRIVER_FILES = "/usr/share/vulkan/icd.d/lvp_icd.json"
LIBGL_ALWAYS_SOFTWARE = "true"
TZ = "UTC"
LANG = "C.UTF-8"

[profiles.devpulse-hardware]
executable = "target/release/devpulselabs"
platforms = ["linux"]
arguments = []
adapter_policy = "hardware-required"
timeout_ms = 30000

[profiles.devpulse-hardware.environment]
EGUIPILOTAI_ADAPTER_POLICY = "hardware-required"

# macOS lane — STAGED (docs/plans/mac-parity.md). Uncomment on the operator's
# Mac once the app builds there; the Mac Claude Code instance owns this.
# [profiles.devpulse-mac]
# executable = "target/release/devpulselabs"
# platforms = ["macos"]
# arguments = []

[fixtures.test-lab]
arguments = ["--route", "workbench/test-lab", "--mood", "0"]

[fixtures.experiments]
arguments = ["--route", "workbench/experiments", "--mood", "0"]

[fixtures.library]
arguments = ["--route", "workbench/library", "--focus", "title", "--mood", "0"]

# The gallery WALL, not a soloed template — the long surface where
# reachability (scrolling to a node) is a real question.
[fixtures.library-wall]
arguments = ["--route", "workbench/library", "--mood", "0"]

[fixtures.viziwiz]
arguments = ["--route", "wiredfront/viziwiz", "--viziwiz", "--mood", "0"]

[fixtures.chat]
arguments = ["--chat-open", "--mood", "0"]

[fixtures.chat-peer]
arguments = ["--chat-open", "--mood", "0"]

[fixtures.chat-authored]
arguments = ["--chat-open", "--chat-authored", "--mood", "0"]

# D1 content seam: the Content domain over a SCRATCH content root, so the
# drill never opens the operator's `/content`. The census is still real —
# `all_episodes` unions the content root with `seeds/episodes/`, which is
# repo truth, so the seed templates populate the rail either way.
[fixtures.chat-content]
arguments = ["--chat-open", "--chat-authored", "--mood", "0"]

[fixtures.chat-content.environment]
CONTENT_ROOT = "target/eguipilotai/content-seam/content"

[fixtures.chat-grok-auth]
arguments = ["--chat-open", "--chat-authored", "--chat-proof", "grok-auth", "--mood", "0"]

# BS1: the worked brainstorm board proof preset — in-memory board only,
# no content root touched (the preset never writes a file).
[fixtures.chat-brainstorm]
arguments = ["--chat-open", "--chat-authored", "--chat-proof", "brainstorm", "--mood", "0"]

[fixtures.wiredfront-editor]
arguments = ["--route", "wiredfront/editor", "--mood", "0"]

# WF1: the Workflows tab + a real storyboard run. CONTENT_ROOT is a scratch
# tree under target/ so the drill's minted run folders never touch the
# operator's content (relative = resolved from the workspace-root CWD).
[fixtures.wiredfront-workflows]
arguments = ["--route", "wiredfront/editor", "--mood", "0"]

[fixtures.wiredfront-workflows.environment]
CONTENT_ROOT = "target/eguipilotai/wf1-content"

# Assist-mode persistence: the REAL chat runtime on scratch rings, so the
# blanket consent writes a real assist-policy.json that the paired
# `chat-assist-persists` scenario proves survives a fresh launch.
[fixtures.chat-assist-real]
arguments = ["--chat-open", "--mood", "0"]

[fixtures.chat-assist-real.environment]
CONTENT_ROOT = "target/eguipilotai/assist-rings/content"
ASSETS_ROOT = "target/eguipilotai/assist-rings/assets"
USERDATA_ROOT = "target/eguipilotai/assist-rings/.userdata"

[fixtures.workbench-studio]
arguments = ["--route", "workbench/studio", "--mood", "0"]

[[projects]]
id = "devpulse-cloud"
profile = "devpulse-cloud"
adapter_policy = "software-required"
required = true
workers = 1
retries = 0

[[projects]]
id = "devpulse-hardware"
profile = "devpulse-hardware"
adapter_policy = "hardware-required"
required = false
workers = 1
retries = 0
