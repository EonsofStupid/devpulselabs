[package]
name = "dpl-hub-workbench"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
egui.workspace = true
dpl-hub.workspace = true
dpl-fabric.workspace = true
dpl-coldlight.workspace = true
dpl-doc.workspace = true
# The `.guide` content model — one of the two container kinds the authoring
# strip can actually label itself with (containers.rs).
dpl-guide.workspace = true
# The artifact INDEX — the Picture tab's picker. Every `Record.rel_path` is
# already content-root-relative, so the media content-jail cannot be violated
# by construction (docs-history-2026-10-12:docs/plans/author-tab-picture.md §2).
dpl-index.workspace = true
dpl-slides.workspace = true
dpl-editor.workspace = true
dpl-engine-capture.workspace = true
egui-pilot-ai.workspace = true
egui-pilot-ai-lab.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Drives the Background tab headlessly — a tapped colour has to reach the
# document, and only running the real widget proves that.
egui_kittest.workspace = true

[lints]
workspace = true
