[package]
name = "dpl-desktop-spike"
version.workspace = true
edition.workspace = true
publish.workspace = true
autobins = false

# Desktop-integration probes. Deliberately NOT a dependency of `crates/app`:
# nothing here can reach a production build, so no feature gate is needed.
# Linux/X11 only — Windows green must not compile AT-SPI / x11rb.

[lints]
workspace = true

[dependencies]
eframe.workspace = true
egui.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
async-io.workspace = true
atspi.workspace = true
zbus.workspace = true
x11rb.workspace = true

[[bin]]
name = "overlay-probe"
path = "src/bin/overlay_probe.rs"

[[bin]]
name = "passthrough-probe"
path = "src/bin/passthrough_probe.rs"

[[bin]]
name = "foreign-target-probe"
path = "src/bin/foreign_target_probe.rs"
