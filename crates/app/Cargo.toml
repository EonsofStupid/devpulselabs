[package]
name = "devpulselabs"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
eguipilotai-devtools = [
    "dep:egui-pilot-ai-runtime",
    "dep:egui-pilot-ai-transport",
    "dep:dpl-chat-testkit",
]

[dependencies]
# Structured logging Ã¢â‚¬â€ RUST_LOG drives verbosity (tracing is the modern std).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
egui.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
egui_extras.workspace = true
image.workspace = true
dpl-hub.workspace = true
dpl-coldlight.workspace = true
dpl-fabric.workspace = true
dpl-shell.workspace = true
dpl-viziwiz.workspace = true
dpl-doc.workspace = true
dpl-engine-capture.workspace = true
dpl-engine-media.workspace = true
dpl-engine-steps.workspace = true
dpl-video.workspace = true
dpl-composer.workspace = true
dpl-guide.workspace = true
dpl-chat-core.workspace = true
dpl-chat-runtime.workspace = true
dpl-chat-social.workspace = true
dpl-chat-interactions.workspace = true
dpl-chat-store.workspace = true
dpl-chat-window.workspace = true
dpl-chat-windows.workspace = true
dpl-chat-codex.workspace = true
dpl-chat-claude.workspace = true
dpl-chat-gemini.workspace = true
dpl-chat-grok.workspace = true
dpl-embedded-deps.workspace = true
dpl-hub-home.workspace = true
dpl-hub-shows.workspace = true
dpl-hub-present.workspace = true
dpl-hub-workbench.workspace = true
dpl-hub-wiredfront.workspace = true
egui-pilot-ai.workspace = true
egui-pilot-ai-runtime = { workspace = true, optional = true }
egui-pilot-ai-transport = { workspace = true, optional = true }
dpl-chat-testkit = { workspace = true, optional = true }
