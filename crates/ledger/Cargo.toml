[package]
name = "dpl-ledger"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
dpl-fabric.workspace = true
dpl-intent.workspace = true
serde.workspace = true
serde_json.workspace = true
# Pure-Rust Parquet write path (ADR-009): no zstd-sys. `snap` is the
# pure-Rust snappy crate; `arrow` is the RecordBatch writer surface.
parquet = { version = "59", default-features = false, features = ["arrow", "snap"] }
arrow-array = "59"
arrow-schema = "55"

[lints]
workspace = true
