[package]
name = "dpl-lottie"
version.workspace = true
edition.workspace = true
publish = false
description = "The app-facing native Lottie façade: spawns the `dpl-lottie-render` subprocess helper (ADR-009) and never links ThorVG, so this crate — and everything that depends on it — stays pure-Rust and unsafe-free. `Player` streams a frame at time t for the timeline; `export_sequence` batches frames for ffmpeg."

[dependencies]
# Quiet subprocess spawns (no console flash) — the W8 house pattern.
dpl-proc.workspace = true
# Read a Lottie's own metadata (size/duration) from the Bodymovin JSON —
# a cheap parse, no renderer: serde_json for `.json`, zip to reach the
# animation JSON inside a `.lottie` (dotLottie) archive.
serde_json.workspace = true
zip.workspace = true

[lints]
workspace = true
