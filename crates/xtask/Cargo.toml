[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Workspace automation (the cargo-xtask pattern): `cargo green` is THE gate."

[dependencies]
dpl-tools-deps.workspace = true
# The contracts phase applies the ONE component evolution rule
# (`dpl_doc::component::evolution_problems`) to every contract against main.
dpl-doc.workspace = true
# `adopt-tool codex`: the adapter proves a candidate (signature, version,
# protocol) with the same checks the app runs before an in-app update.
dpl-chat-codex.workspace = true
# The smoke phase decodes what the renderers actually PRODUCED. Counting
# opaque pixels is the whole point: three separate failures shipped behind an
# exit code of 0, and only the pixels would have caught them.
image.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
pelite = "0.10.0"

[lints]
workspace = true
