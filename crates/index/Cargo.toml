[package]
name = "dpl-index"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# TURSO — the pure-Rust SQLite engine, operator-ratified (docs-history-2026-10-12:docs/plans/x1-index.md):
# the same engine the old repo proved, as a local embedded file. Its
# async API wraps behind this crate's sync surface via a current-thread
# tokio runtime; fresh connection per op (a local file opens cheaply).
turso.workspace = true
tokio = { workspace = true, features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
dpl-engine-capture.workspace = true

# DECLARED so the SOURCE can be snake_case like every other `src/bin` file
# while the BINARY keeps its kebab name (architecture.md §4). The shipped
# name `dpl-index-cli` is unchanged — only the file and the declaration move.
[[bin]]
name = "dpl-index-cli"
path = "src/bin/dpl_index_cli.rs"

[lints]
workspace = true
