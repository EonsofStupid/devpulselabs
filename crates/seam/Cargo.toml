[package]
name = "dpl-seam"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dpl-index.workspace = true
axum.workspace = true
# The seam owns its runtime on a background thread — the egui thread is
# never touched. Features are additive over the workspace's sync-only base.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "time"] }
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"

dpl-fabric.workspace = true
dpl-hub.workspace = true
# The comp-document surface (R1w): the doctor gates every write; the
# stitch render is the same ffmpeg engine the editor's Render chip uses.
dpl-comp.workspace = true
dpl-engine-media.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
# Tests construct a real HubSpec (its tone rides ColdLight).
dpl-coldlight.workspace = true
