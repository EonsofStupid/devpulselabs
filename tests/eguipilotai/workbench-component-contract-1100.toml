# LS1 (R285) at 1100x700: the stage keeps the room, so the contract panel
# starts closed and the "contract" toggle opens it. The click is a pilot
# event inside the app's own window (no desktop input).
id = "workbench-component-contract-1100"
fixture = "library-1100"
record = true

[[steps]]
kind = "expect"

[steps.expectation]
type = "count"
value = 0

[steps.expectation.target]
id = "root/workbench.library.template/contract"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.library.template/contract-toggle"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "root/workbench.library.template/contract"

# The title card's lines rise in once (S1b); capture it at rest.
[[steps]]
kind = "wait"
milliseconds = 1500

[[steps]]
kind = "capture"
name = "workbench-component-contract-1100"
