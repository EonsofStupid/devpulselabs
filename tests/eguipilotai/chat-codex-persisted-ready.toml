# Operator-state proof: the official Codex client is already ChatGPT-
# authenticated. DevPULSE must project Ready from `codex login status` alone.
#
# THIS SCENARIO INVERTED ON 2026-08-06. It used to assert that conversation
# actions stay DISABLED, because "Codex is activation-only until the CH4
# app-server pass". That pass landed (docs-history-2026-10-12:docs/plans/codex-host-wiring.md): Codex
# now has a live transport, the host drives it through the provider seam, and
# a connected runtime advertises `StreamTurns`. Ready-and-unsendable was the
# defect the operator named from the program's first message — "it shows
# active and I cannot chat" — so continuing to pin it would pin the bug.
#
# The `chat-peer` fixture is LIVE: it passes `--chat-open` WITHOUT
# `--chat-authored`, so `provider_runtime_enabled` is true and the real
# app-server child is started. That is what makes the enabled assertions below
# meaningful — and it also means this scenario needs the operator's real Codex
# login, exactly as it always has to report `Ready`.
#
# What it pins now: capability is EARNED from a connected runtime
# (`qualified_capabilities`), never assumed from an activation state. Grok's
# independent real state stays visible in the same catalog.
id = "chat-codex-persisted-ready"
fixture = "chat-peer"
record = true

[[steps]]
kind = "expect"

[steps.expectation]
type = "viewport"
state = "open"

[steps.expectation.viewport]
key = "chat.primary"

[[steps]]
kind = "wait"
milliseconds = 750

[[steps]]
kind = "action"

[steps.action]
type = "focus-viewport"

[steps.action.viewport]
key = "chat.primary"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "chat.primary/chat.sidebar.providers"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog"

[[steps]]
kind = "expect"

[steps.expectation]
type = "value"
value = "Ready"

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers/codex"

[[steps]]
kind = "expect"

[steps.expectation]
type = "value"
value = "Ready"

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers/grok"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "chat.primary/chat.sidebar.providers/codex"

# The app-server child has to spawn, answer `initialize`, and have its
# advertised capabilities qualified before the surface can offer anything.
# That is a real process on a cold start, so the wait is generous — a short
# one would make this scenario flaky in a way that reads as a regression.
[[steps]]
kind = "wait"
milliseconds = 8000

# Send is gated on FOUR things, and only one of them is the transport:
# not reading history · a session selected · `can_send()` · a NON-EMPTY draft.
# An empty composer is disabled with "Type a message first." no matter how
# qualified the provider is, so asserting `enabled` on an empty composer would
# pass before this pass and after it — proving nothing. Typing first is what
# isolates the transport as the variable under test.
[[steps]]
kind = "action"

[steps.action]
type = "fill"
text = "hello"

[steps.action.target]
id = "chat.primary/chat.composer"

[[steps]]
kind = "wait"
milliseconds = 300

# THE ASSERTION THIS PASS EXISTS FOR. With a draft present, Send can only be
# enabled if `can_send()` is true — and that is qualified from what the runtime
# ADVERTISED at connect, never hard-coded. Before this pass the tooltip here
# read "This provider's live turn transport is not qualified."
[[steps]]
kind = "expect"

[steps.expectation]
type = "enabled"

[steps.expectation.target]
id = "chat.primary/chat.composer.send"

# `StartSession` is qualified by the same handshake.
[[steps]]
kind = "expect"

[steps.expectation]
type = "enabled"

[steps.expectation.target]
id = "chat.primary/chat.provider.new-chat/sidebar"

[[steps]]
kind = "action"

[steps.action]
type = "close-viewport"

[steps.action.viewport]
key = "chat.primary"
