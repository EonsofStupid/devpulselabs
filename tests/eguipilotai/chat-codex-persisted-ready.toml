# Operator-state proof: the official Codex client is already ChatGPT-
# authenticated. DevPULSE must project Ready from `codex login status` alone.
#
# Conversation actions stay DISABLED here, and the reason changed on
# 2026-08-06. It is no longer "Codex has no transport" — it has one (the
# app-server runtime, docs/plans/codex-host-wiring.md). It is that this
# scenario runs on an AUTHORED fixture, where `provider_runtime_enabled` is
# false and no live runtime is ever started, so nothing advertises
# `StreamTurns`.
#
# That makes this scenario a pin on the SEAM'S CENTRAL GUARANTEE: capability
# is earned from a connected runtime, never assumed from an activation state.
# Ready-but-unsendable is the correct reading when the provider is signed in
# and nothing is connected. Grok's independent real state stays visible in the
# same catalog.
id = "chat-codex-persisted-ready"
fixture = "chat-peer"
record = true

[[steps]]
kind = "expect"

[steps.expectation]
type = "viewport"
state = "open"

[steps.expectation.viewport]
key = "chat.primary"

[[steps]]
kind = "wait"
milliseconds = 750

[[steps]]
kind = "action"

[steps.action]
type = "focus-viewport"

[steps.action.viewport]
key = "chat.primary"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "chat.primary/chat.sidebar.providers"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog"

[[steps]]
kind = "expect"

[steps.expectation]
type = "value"
value = "Ready"

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers/codex"

[[steps]]
kind = "expect"

[steps.expectation]
type = "value"
value = "Ready"

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers/grok"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "chat.primary/chat.sidebar.providers/codex"

[[steps]]
kind = "expect"

[steps.expectation]
type = "disabled"

[steps.expectation.target]
id = "chat.primary/chat.provider.new-chat/sidebar"

[[steps]]
kind = "expect"

[steps.expectation]
type = "disabled"

[steps.expectation.target]
id = "chat.primary/chat.composer.send"

[[steps]]
kind = "action"

[steps.action]
type = "close-viewport"

[steps.action.viewport]
key = "chat.primary"
