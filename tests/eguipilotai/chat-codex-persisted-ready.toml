# Operator-state proof: the official Codex client is already ChatGPT-
# authenticated. DevPULSE must project Ready from `codex login status` alone
# and must NOT enable conversation actions — Codex is activation-only until
# the CH4 app-server pass. Grok's independent real state stays visible in the
# same catalog.
id = "chat-codex-persisted-ready"
fixture = "chat-peer"
record = true

[[steps]]
kind = "expect"

[steps.expectation]
type = "viewport"
state = "open"

[steps.expectation.viewport]
key = "chat.primary"

[[steps]]
kind = "wait"
milliseconds = 750

[[steps]]
kind = "action"

[steps.action]
type = "focus-viewport"

[steps.action.viewport]
key = "chat.primary"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "chat.primary/chat.sidebar.providers"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog"

[[steps]]
kind = "expect"

[steps.expectation]
type = "value"
value = "Ready"

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers/codex"

[[steps]]
kind = "expect"

[steps.expectation]
type = "value"
value = "Ready"

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers/grok"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "chat.primary/chat.sidebar.providers/codex"

[[steps]]
kind = "expect"

[steps.expectation]
type = "disabled"

[steps.expectation.target]
id = "chat.primary/chat.provider.new-chat/sidebar"

[[steps]]
kind = "expect"

[steps.expectation]
type = "disabled"

[steps.expectation.target]
id = "chat.primary/chat.composer.send"

[[steps]]
kind = "action"

[steps.action]
type = "close-viewport"

[steps.action.viewport]
key = "chat.primary"
