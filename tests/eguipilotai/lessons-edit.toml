# LS3a (R285): an edit made inside a lesson, after `lessons-page`. Make a
# second lesson that uses the quote card (the shelf's second, "What
# changed"), then change that card from the first lesson (follow Neon
# intro): the first lesson shows the change straight away and says the
# other lesson will ask first.
id = "lessons-edit"
fixture = "lessons-page"
record = true

[[steps]]
kind = "wait"
milliseconds = 1500

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.lessons/new"

[[steps]]
kind = "wait"
milliseconds = 500

[[steps]]
kind = "action"

[steps.action]
type = "fill"
text = "Second lesson"

[steps.action.target]
id = "root/workbench.lessons/name"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.lessons/create"

[[steps]]
kind = "wait"
milliseconds = 1200

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.lessons/add"

[[steps]]
kind = "wait"
milliseconds = 1500

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "root/workbench.lessons.shelf/1"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.lessons.shelf/1"

[[steps]]
kind = "wait"
milliseconds = 800

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.lessons/back"

[[steps]]
kind = "wait"
milliseconds = 1000

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.lessons.lesson/New lesson"

[[steps]]
kind = "wait"
milliseconds = 1200

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.lessons/use/u1/edit"

[[steps]]
kind = "wait"
milliseconds = 1500

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/editor.look/neon-intro"

[[steps]]
kind = "wait"
milliseconds = 600

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/editor/keep"

[[steps]]
kind = "wait"
milliseconds = 800

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.lessons/edit-back"

[[steps]]
kind = "wait"
milliseconds = 1500

[[steps]]
kind = "expect"

[steps.expectation]
type = "text"
value = "Your change shows in this lesson. 1 other lesson using this card will ask first."

[steps.expectation.target]
id = "root/workbench.lessons/status"

[[steps]]
kind = "capture"
name = "lessons-edited"
