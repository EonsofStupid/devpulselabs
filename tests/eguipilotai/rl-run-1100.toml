# RL: `rl-run` at the minimum real window (1100x700), after `rl-make`.
id = "rl-run-1100"
fixture = "lessons-rl-1100"
record = true

[[steps]]
kind = "wait"
milliseconds = 1500

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.lessons.lesson/New lesson"

[[steps]]
kind = "wait"
milliseconds = 1200

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "root/workbench.lessons/run"

[[steps]]
kind = "capture"
name = "rl-run-lesson-1100"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.lessons/run"

[[steps]]
kind = "wait"
milliseconds = 2500

[[steps]]
kind = "expect"

[steps.expectation]
type = "viewport"
state = "open"

[steps.expectation.viewport]
key = "present.presenter"

[[steps]]
kind = "action"

[steps.action]
type = "focus-viewport"

[steps.action.viewport]
key = "root"

[[steps]]
kind = "wait"
milliseconds = 600

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "root/deck/next"

[steps.expectation.target.viewport]
key = "root"

[[steps]]
kind = "capture"
name = "rl-run-running-1100"

[steps.viewport]
key = "root"

