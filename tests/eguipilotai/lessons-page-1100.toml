kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.lessons/add"

[[steps]]
kind = "wait"
milliseconds = 1200

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "root/workbench.lessons.shelf/0"

[[steps]]
kind = "capture"
name = "lessons-shelf-1100"
