# LS3a (R285): the Lessons page at the minimum real window (1100x700),
# after `lessons-update`: the list, then the first lesson's three cards
# with their jobs and controls, then its library shelf.
id = "lessons-page-1100"
fixture = "lessons-page-1100"
record = true

[[steps]]
kind = "wait"
milliseconds = 1500

[[steps]]
kind = "capture"
name = "lessons-list-1100"

[[steps]]
kind = "action"

