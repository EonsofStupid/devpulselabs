id = "chat-provider-catalog"
fixture = "chat-authored"
record = true

[[steps]]
kind = "expect"

[steps.expectation]
type = "viewport"
state = "open"

[steps.expectation.viewport]
key = "chat.primary"

[[steps]]
kind = "wait"
milliseconds = 750

[[steps]]
kind = "action"

[steps.action]
type = "focus-viewport"

[steps.action.viewport]
key = "chat.primary"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "chat.primary/chat.overlay/interaction-1003/reject"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "chat.primary/chat.sidebar.providers"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers/codex"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers/claude"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers/gemini"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers/grok"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog/clyffy"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog/local"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog/custom"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "chat.primary/chat.provider.catalog/local"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.configuration"

[[steps]]
kind = "expect"

[steps.expectation]
type = "value"
value = "http://127.0.0.1:11434"

[steps.expectation.target]
id = "chat.primary/chat.provider.configuration.endpoint"

[[steps]]
kind = "expect"

[steps.expectation]
type = "enabled"

[steps.expectation.target]
id = "chat.primary/chat.provider.configuration.save"

[[steps]]
kind = "action"

[steps.action]
type = "close-viewport"

[steps.action.viewport]
key = "chat.primary"
