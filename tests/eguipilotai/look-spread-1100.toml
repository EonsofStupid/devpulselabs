# LK2b (R286): changes that spread, on the real exe. Two cards follow Neon
# intro (Layouts → Quote, then Layouts → Title card). The second makes its
# background Orchid haze and "Makes these the look's new style": the sheet
# says "This changes 1 other slide" and shows it before and after; confirm,
# and the look is your version. One Undo puts the built-in back and the
# change on the slide. Push again, then "Back to the built-in" (your
# version is kept on disk). Last, "Open the look": a colour change lands in
# the look, and the slide keeps following. Fixture `author-ls2-1100` (scratch
# content root); clear its `library` before a run so the count is exact.
