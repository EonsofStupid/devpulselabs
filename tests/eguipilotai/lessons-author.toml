# LS3a (R285): build into a lesson from Author on the real exe. The
# Building-into bar is on Lesson (`--author-container lesson`): make a new
# lesson, start two cards (Layouts → Quote, then Title card), then Put them
# in — the lesson gains two uses and the cards stay in the library. Fixture
# `lessons-author` (scratch content root); clear
# `target/eguipilotai/ls3a/content` first. The `lessons-*` scenarios run
# after this one, in order: page, edit, update.
id = "lessons-author"
fixture = "lessons-author"
record = true

