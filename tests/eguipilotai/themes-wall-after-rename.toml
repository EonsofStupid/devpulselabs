# N1 proof: the Themes wall still paints every frame patch LIVE through the
# compositor after `trait` → `FramePatch` and the axes moved onto egui::Frame.
# A rename that leaves the wall blank is a rename that broke the generator.
id = "themes-wall-after-rename"
fixture = "library-wall"
record = true

[[steps]]
kind = "wait"
milliseconds = 900

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.library.section/themes"

[[steps]]
kind = "wait"
milliseconds = 500

[[steps]]
kind = "capture"
name = "themes-wall-frame-patches"

[steps.viewport]
key = "root"
