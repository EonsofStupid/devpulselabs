# C2a proof: the rail lists only the providers that are turned on, under two
# chips; both ways in open ONE catalog where every provider is a tile; and
# selecting a tile hands the provider to the conversation pane.
#
# `chat-authored` is deterministic: Codex is Ready and Gemini is Experimental
# (both activated), Claude is Blocked and Grok is signed out (neither).
#
# The pilot does not screenshot the chat window (a deferred viewport); it
# drives and asserts, and the captures are taken separately.
id = "chat-providers-carousel"
fixture = "chat-authored"
record = true

[[steps]]
kind = "expect"

[steps.expectation]
type = "viewport"
state = "open"

[steps.expectation.viewport]
key = "chat.primary"

[[steps]]
kind = "wait"
milliseconds = 750

[[steps]]
kind = "action"

[steps.action]
type = "focus-viewport"

[steps.action.viewport]
key = "chat.primary"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "chat.primary/chat.overlay/interaction-1003/reject"

# The rail's AI Providers control names how many providers are turned on.
[[steps]]
kind = "expect"

[steps.expectation]
type = "value"
value = "2 activated"

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers"

# Only the activated providers are rows in the rail.
[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers/codex"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers/gemini"

[[steps]]
kind = "expect"

[steps.expectation]
type = "count"
value = 0

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers/claude"

[[steps]]
kind = "expect"

[steps.expectation]
type = "count"
value = 0

[steps.expectation.target]
id = "chat.primary/chat.sidebar.providers/grok"

# The composer's second way in.
[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "chat.primary/chat.composer.add-provider"

[[steps]]
kind = "wait"
milliseconds = 400

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog"

# SUBSCRIPTIONS — every registered provider is a tile, on or off.
[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog/codex"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog/claude"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog/gemini"

[[steps]]
kind = "expect"

[steps.expectation]
type = "value"
value = "Signed out"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog/grok"

# The house adapter and both ways to add a provider stay in the catalog.
[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog/clyffy"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog/local"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog/custom"

# Close, then the rail's own way in opens the same catalog.
[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "chat.primary/chat.provider.catalog.close"

[[steps]]
kind = "wait"
milliseconds = 300

[[steps]]
kind = "expect"

[steps.expectation]
type = "count"
value = 0

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "chat.primary/chat.sidebar.providers"

[[steps]]
kind = "wait"
milliseconds = 400

# Selecting a signed-out tile is just a selection: the catalog closes and
# the conversation pane takes it from there.
[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "chat.primary/chat.provider.catalog/grok"

[[steps]]
kind = "wait"
milliseconds = 400

[[steps]]
kind = "expect"

[steps.expectation]
type = "count"
value = 0

[steps.expectation.target]
id = "chat.primary/chat.provider.catalog"

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "chat.primary/chat.composer"

[[steps]]
kind = "action"

[steps.action]
type = "close-viewport"

[steps.action.viewport]
key = "chat.primary"
