# LS3a (R285): Update available, after `lessons-edit`. The second lesson
# still shows the version it chose, says a newer one is there, compares
# the two side by side, and takes the newest on Update.
id = "lessons-update"
fixture = "lessons-page"
record = true

[[steps]]
kind = "wait"
milliseconds = 1500

[[steps]]
kind = "capture"
name = "lessons-list"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.lessons.lesson/Second lesson"

[[steps]]
kind = "wait"
milliseconds = 1500

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "root/workbench.lessons/use/u1/compare"

[[steps]]
kind = "capture"
name = "lessons-newer"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.lessons/use/u1/compare"

[[steps]]
kind = "wait"
milliseconds = 1500

[[steps]]
kind = "expect"

[steps.expectation]
type = "visible"

[steps.expectation.target]
id = "root/workbench.lessons/compare/after"

[[steps]]
kind = "capture"
name = "lessons-compare"

[[steps]]
kind = "action"

[steps.action]
type = "click"

[steps.action.target]
id = "root/workbench.lessons/compare/update"

[[steps]]
kind = "wait"
milliseconds = 1500

[[steps]]
kind = "capture"
name = "lessons-updated"
