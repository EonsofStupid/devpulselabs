<!doctype html>
<html><head>
<!-- DevPULSE authoring mock — artifact a3db4aee-9c6c-433c-a50d-35848a54d7ac.
     THE ratified reference for the authoring lane (POA&M R1).
     Saved into the repo on 2026-07-29 because an artifact URL can rot and
     every pass in this lane has to be able to open it cold.
     Host frame-runtime scripts stripped; the mock itself is verbatim. -->
<meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>DevPULSE — Author</title>
<style>
  :root{
    --ground:#0b0e14; --raised:#151a24; --raised-2:#1b2230; --well:#090c11;
    --hairline:#2a3140; --hairline-2:#39435a;
    --ink-strong:#e8edf5; --ink:#9aa6b8; --ink-muted:#5f6b7e;
    --cyan:#28e0d0; --amber:#ffb020; --magenta:#ff4fd8; --coral:#ff6a5c; --good:#4ade80;
    --tone:var(--cyan); --tone-soft:rgba(40,224,208,.16); --tone-glow:rgba(40,224,208,.22);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --r:8px; --shadow:5px 5px 0 rgba(0,0,0,.55); --shadow-sm:3px 3px 0 rgba(0,0,0,.5);
    --tap:52px;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;min-height:100vh;
    background-image:radial-gradient(120% 70% at 85% -12%,rgba(40,224,208,.05),transparent 60%);
  }
  .wrap{max-width:1340px;margin:0 auto;padding:clamp(14px,2.2vw,24px)}
  .wrap.has-strip{padding-bottom:196px}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-muted)}
  h1{font-weight:800;font-size:clamp(23px,3.3vw,34px);line-height:1.06;letter-spacing:-.02em;color:var(--ink-strong);margin:.14em 0 .12em;text-wrap:balance}
  h1 .lit{color:var(--tone)}
  .dek{font-size:15px;color:var(--ink);max-width:62ch;margin:0 0 20px}
  .num{font-variant-numeric:tabular-nums}

  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--hairline)}
  .crumb{font-family:var(--mono);font-size:12px;color:var(--ink-muted);display:flex;align-items:center;gap:7px}
  .crumb b{color:var(--ink-strong);font-weight:600}
  .crumb .sep{color:var(--hairline-2)}
  .crumb button{border:none;padding:0;min-height:0;background:none;color:inherit;font:inherit;cursor:pointer}
  .crumb button:hover{color:var(--ink-strong)}
  .topbar .sp{flex:1}
  .sig{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);border:1px solid var(--hairline);border-radius:999px;padding:6px 12px;background:var(--raised)}
  .sig .led{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(74,222,128,.16)}
  .sig b{color:var(--good);font-weight:600}

  .btn{font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;background:var(--raised-2);color:var(--ink);border:1px solid var(--hairline-2);border-radius:var(--r);padding:11px 15px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{border-color:var(--ink-muted);color:var(--ink-strong)}
  .btn:active{transform:translate(1px,1px)}
  .btn:focus-visible{outline:3px solid var(--tone);outline-offset:2px}
  .btn.tone{border-color:var(--tone);color:var(--tone)}
  .btn.tone:hover{background:var(--tone-soft)}
  .btn.ai{border-color:var(--magenta);color:var(--magenta)}
  .btn.ai:hover{background:rgba(255,79,216,.1)}
  .btn.ghost{background:none}

  /* ── dashboard ── */
  .lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(276px,1fr));gap:16px;margin:6px 0 30px}
  .lane{position:relative;text-align:left;background:linear-gradient(180deg,var(--raised),var(--raised-2));border:1px solid var(--hairline-2);border-radius:14px;box-shadow:var(--shadow);padding:20px 18px 17px;cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;gap:9px;min-height:186px;transition:transform .1s,border-color .1s}
  .lane:hover{border-color:var(--lane-tone,var(--tone))}
  .lane:active{transform:translate(2px,2px)}
  .lane:focus-visible{outline:3px solid var(--lane-tone,var(--tone));outline-offset:3px}
  .lane .glyph{font-size:24px;line-height:1;color:var(--lane-tone,var(--tone))}
  .lane .lt{font-weight:800;font-size:18px;color:var(--ink-strong);letter-spacing:-.01em}
  .lane .ld{font-size:13.5px;color:var(--ink);line-height:1.45}
  .lane .lfoot{margin-top:auto;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:10px}
  .lane .lfoot b{color:var(--lane-tone,var(--tone));font-weight:600}

  .sechead{display:flex;align-items:baseline;gap:11px;margin:0 0 12px;flex-wrap:wrap}
  .sechead .st{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted)}
  .sechead .sd{font-size:12.5px;color:var(--ink-muted)}

  .recents{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:13px;margin-bottom:26px}
  .rec{text-align:left;background:var(--raised);border:1px solid var(--hairline);border-radius:11px;box-shadow:var(--shadow-sm);padding:13px 14px;cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;gap:7px;min-height:112px;transition:border-color .1s}
  .rec:hover{border-color:var(--k-tone,var(--tone))}
  .rec:active{transform:translate(1px,1px)}
  .rec:focus-visible{outline:3px solid var(--k-tone,var(--tone));outline-offset:2px}
  .rec .kind{align-self:flex-start;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--k-tone,var(--tone));border:1px solid currentColor;border-radius:999px;padding:2px 8px}
  .rec .rn{font-weight:700;color:var(--ink-strong);font-size:14px;line-height:1.25}
  .rec .rm{margin-top:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-muted)}

  /* ── container bar ── */
  .cbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--raised);border:1px solid var(--hairline);border-radius:12px;box-shadow:var(--shadow-sm);padding:11px 13px;margin-bottom:15px}
  .cbar .into{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
  .sel{font-family:var(--mono);font-size:12.5px;background:var(--well);color:var(--ink-strong);border:1px solid var(--hairline-2);border-radius:var(--r);padding:0 11px;min-height:44px;cursor:pointer}
  .sel:focus-visible{outline:3px solid var(--tone);outline-offset:2px}
  .cbar .sp{flex:1}

  /* ── intent ── */
  .intent{background:linear-gradient(180deg,var(--raised),var(--raised-2));border:1px solid var(--hairline-2);border-radius:14px;box-shadow:var(--shadow);padding:15px 15px 13px;margin-bottom:18px}
  .intent .lab{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--tone);margin-bottom:9px;display:flex;align-items:center;gap:8px}
  .intent .lab .dot{width:7px;height:7px;border-radius:50%;background:var(--tone);box-shadow:0 0 0 3px var(--tone-soft)}
  .intent-in{width:100%;min-height:var(--tap);background:var(--well);border:1px solid var(--hairline);border-radius:var(--r);color:var(--ink-strong);font-family:var(--sans);font-size:16px;padding:13px 15px;outline:none;line-height:1.4}
  .intent-in:focus{border-color:var(--tone);box-shadow:0 0 0 3px var(--tone-soft)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .chip{font-family:var(--sans);font-size:13.5px;background:var(--raised-2);color:var(--ink);border:1px solid var(--hairline-2);border-radius:999px;padding:9px 15px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;gap:8px}
  .chip:hover{border-color:var(--tone);color:var(--ink-strong)}
  .chip:active{transform:translate(1px,1px)}
  .chip:focus-visible{outline:3px solid var(--tone);outline-offset:2px}

  /* ══ THE SHELF PICKER ══ */
  .shelves{display:flex;gap:9px;flex-wrap:wrap;align-items:stretch;margin-bottom:14px}
  .shelf{font-family:var(--sans);font-weight:700;font-size:15.5px;background:var(--raised);color:var(--ink);border:1px solid var(--hairline);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:9px 17px;cursor:pointer;min-height:var(--tap);display:flex;flex-direction:column;justify-content:center;gap:2px;line-height:1.12;text-align:left}
  .shelf .sh{font-family:var(--sans);font-size:11.5px;font-weight:400;color:var(--ink-muted);letter-spacing:0}
  .shelf[aria-selected="true"]{border-color:var(--tone);color:var(--tone);box-shadow:0 0 0 1px var(--tone),var(--shadow-sm)}
  .shelf[aria-selected="true"] .sh{color:var(--tone);opacity:.75}
  .shelf:hover{border-color:var(--ink-muted)}
  .shelf[aria-selected="true"]:hover{border-color:var(--tone)}
  .shelf:focus-visible{outline:3px solid var(--tone);outline-offset:2px}

  /* ══ THE CAROUSEL ══ */
  .carwrap{position:relative;margin-bottom:12px}
  .carhead{display:flex;align-items:center;gap:11px;margin-bottom:10px;flex-wrap:wrap}
  .carhead .ct{font-size:14px;color:var(--ink)}
  .carhead .ct b{color:var(--ink-strong);font-weight:700}
  .carhead .sp{flex:1}
  .carhead .count{font-family:var(--mono);font-size:11px;color:var(--ink-muted);white-space:nowrap}
  .toggle{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);background:var(--raised);border:1px solid var(--hairline);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:0 14px;min-height:46px;cursor:pointer;user-select:none}
  .toggle input{width:18px;height:18px;accent-color:var(--tone);cursor:pointer;margin:0}
  .toggle:hover{border-color:var(--ink-muted)}
  .toggle:focus-within{outline:3px solid var(--tone);outline-offset:2px}

  .carrow{position:relative;display:flex;align-items:stretch;gap:10px}
  .arrow{flex:0 0 56px;background:var(--raised);border:1px solid var(--hairline-2);border-radius:var(--r);color:var(--ink);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);transition:border-color .1s,color .1s}
  .arrow:hover{border-color:var(--tone);color:var(--tone)}
  .arrow:active{transform:translate(1px,1px)}
  .arrow:focus-visible{outline:3px solid var(--tone);outline-offset:2px}
  .arrow[disabled]{opacity:.3;cursor:default}
  .arrow[disabled]:hover{border-color:var(--hairline-2);color:var(--ink)}

  .car{flex:1;min-width:0;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:4px 2px 12px;
       scrollbar-width:thin;scrollbar-color:var(--hairline-2) transparent;cursor:grab}
  .car.dragging{cursor:grabbing;scroll-behavior:auto;scroll-snap-type:none}
  .car::-webkit-scrollbar{height:8px}
  .car::-webkit-scrollbar-thumb{background:var(--hairline-2);border-radius:99px}
  .car::-webkit-scrollbar-track{background:transparent}

  .pick{flex:0 0 300px;scroll-snap-align:start;background:var(--raised);border:1px solid var(--hairline);border-radius:13px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:transform .1s,border-color .1s;font:inherit;color:inherit;text-align:left;padding:0;position:relative}
  @media (max-width:720px){.pick{flex-basis:246px}}
  .pick:hover{border-color:var(--tone)}
  .pick:active{transform:translate(2px,2px)}
  .pick:focus-visible{outline:3px solid var(--tone);outline-offset:3px}
  .pick.pulse{animation:pop .3s ease}
  @keyframes pop{40%{transform:translate(2px,2px) scale(.97)}100%{transform:none}}
  .pick .stage{aspect-ratio:16/9;margin:12px 12px 0;border-radius:9px;background:var(--well);border:1px solid #05070b;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .pick .stage::before{content:"";position:absolute;inset:-30% -10% auto auto;width:64%;height:120%;background:radial-gradient(closest-side,var(--tone-glow),transparent 70%);pointer-events:none}
  .pick .meta{padding:11px 14px 14px;display:flex;flex-direction:column;gap:3px}
  .pick .pn{font-weight:700;color:var(--ink-strong);font-size:15.5px;line-height:1.2}
  .pick .pd{font-size:12.5px;color:var(--ink-muted);line-height:1.4}
  .pick .use{position:absolute;top:20px;right:20px;font-size:11.5px;font-weight:700;color:var(--ground);background:var(--tone);border-radius:6px;padding:5px 11px;opacity:0;transition:opacity .12s;pointer-events:none}
  .pick:hover .use,.pick:focus-visible .use{opacity:1}

  .caredge{position:absolute;top:4px;bottom:12px;width:44px;pointer-events:none;z-index:2}
  .caredge.l{left:66px;background:linear-gradient(90deg,var(--ground),transparent)}
  .caredge.r{right:66px;background:linear-gradient(270deg,var(--ground),transparent)}

  .emptyshelf{flex:1;display:flex;flex-direction:column;gap:9px;justify-content:center;background:var(--raised);border:1px dashed var(--hairline-2);border-radius:13px;padding:26px 28px;min-height:236px}
  .emptyshelf .et{font-weight:800;color:var(--ink-strong);font-size:17px}
  .emptyshelf .ed{font-size:13.5px;color:var(--ink);max-width:56ch;line-height:1.5}

  /* holographic gap arrows */
  .holo{position:fixed;left:50%;transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:10px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tone);
    background:linear-gradient(180deg,rgba(21,26,36,.94),rgba(9,12,17,.94));
    border:1px solid var(--tone);border-radius:999px;padding:11px 18px;cursor:pointer;min-height:46px;
    box-shadow:0 0 0 1px rgba(40,224,208,.2),0 0 26px rgba(40,224,208,.34),var(--shadow-sm);
    backdrop-filter:blur(3px);overflow:hidden}
  .holo.on{display:inline-flex;animation:holoIn .22s ease}
  .holo::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(40,224,208,.13) 0 1px,transparent 1px 4px);
    animation:scan 5s linear infinite;opacity:.8}
  .holo .arw{font-size:15px;animation:bob 1.5s ease-in-out infinite}
  .holo.down{bottom:206px}
  @keyframes holoIn{from{opacity:0;transform:translateX(-50%) scale(.94)}to{opacity:1;transform:translateX(-50%) scale(1)}}
  @keyframes bob{50%{transform:translateY(3px)}}
  @keyframes scan{to{background-position:0 40px}}

  /* ── mini renders ── */
  .mini{width:88%;aspect-ratio:16/9;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px 14px;overflow:hidden}
  .mini .eb{font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--tone)}
  .mini .h{font-weight:800;color:var(--ink-strong);font-size:17px;line-height:1.1}
  .mini .sub{font-size:10.5px;color:var(--ink-muted)}
  .mini .big{font-weight:800;font-size:46px;color:var(--tone);line-height:.95;font-variant-numeric:tabular-nums}
  .mini .cap{font-size:10.5px;color:var(--ink)}
  .mini .quote{font-style:italic;color:var(--ink-strong);font-size:14px;line-height:1.3}
  .mini .rule{height:2px;width:34%;background:var(--tone);border-radius:2px;margin-top:2px}
  .bars{display:flex;flex-direction:column;gap:8px;width:100%}
  .brow{display:flex;align-items:center;gap:8px}
  .brow .bl{font-size:9.5px;color:var(--ink);width:38px}
  .brow .bt{flex:1;height:10px;border-radius:999px;background:var(--raised-2)}
  .brow .bf{height:100%;border-radius:999px;background:var(--tone)}
  .brow .bf.alt{background:var(--ink-muted)}
  .cells{display:flex;gap:14px;justify-content:center}
  .cells .c .v{font-weight:800;font-size:22px;color:var(--tone);text-align:center;font-variant-numeric:tabular-nums}
  .cells .c .l{font-size:8.5px;color:var(--ink);text-align:center}
  .tl{display:flex;align-items:center;width:90%}
  .tl .n{width:12px;height:12px;border-radius:50%;background:var(--tone);flex-shrink:0}
  .tl .n.off{background:var(--raised-2);border:1px solid var(--hairline-2)}
  .tl .seg{height:2px;flex:1;background:var(--hairline-2)}
  .quiz .qq{font-size:11.5px;color:var(--ink-strong);margin-bottom:8px;font-weight:600}
  .quiz .opt{font-family:var(--mono);font-size:9.5px;border:1px solid var(--hairline-2);border-radius:999px;padding:4px 10px;color:var(--ink);margin:0 5px 5px 0;display:inline-block}
  .quiz .opt.hot{border-color:var(--tone);color:var(--tone)}
  .arc{width:80px;height:80px;transform:rotate(-90deg)}
  .r-eyebrow{font-family:var(--mono);font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--tone);font-weight:600;text-align:center;word-break:break-word}
  .r-badges{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
  .r-badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:5px 11px;display:inline-flex;align-items:center;gap:6px}
  .r-badge.n{background:var(--raised-2);color:var(--ink);border:1px solid var(--hairline-2)}
  .r-badge.l{background:var(--tone);color:var(--ground);font-weight:700}
  .r-badge.l .d{width:5px;height:5px;border-radius:50%;background:var(--ground)}
  .swatch{width:76px;height:50px;border-radius:9px;background:var(--tone);box-shadow:4px 4px 0 rgba(0,0,0,.5)}
  .swatch.clay{background:linear-gradient(145deg,var(--tone),rgba(0,0,0,.42));box-shadow:inset 3px 3px 8px rgba(255,255,255,.22),inset -3px -3px 8px rgba(0,0,0,.45)}
  .swatch.dash{background:var(--raised-2);border:2px dashed var(--tone);box-shadow:none}

  /* ── filmstrip ── */
  .strip{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(11,14,20,.55),var(--ground) 34%);border-top:1px solid var(--hairline);backdrop-filter:blur(2px);z-index:30}
  .strip-in{max-width:1340px;margin:0 auto;padding:11px clamp(14px,2.2vw,24px) 13px}
  .strip-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
  .strip-head .t{font-size:13px;color:var(--ink-muted)}
  .strip-head .t b{color:var(--ink-strong);font-weight:700}
  .strip-head .kindpill{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--k-tone,var(--tone));border:1px solid currentColor;border-radius:999px;padding:2px 8px}
  .strip-head .sp{flex:1}
  .film{display:flex;gap:11px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
  .fcard{flex:0 0 166px;scroll-snap-align:start;background:var(--raised);border:1px solid var(--hairline);border-radius:9px;box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer;min-height:102px;display:flex;flex-direction:column;transition:border-color .1s;font:inherit;color:inherit;padding:0}
  .fcard:hover{border-color:var(--tone)}
  .fcard:active{transform:translate(1px,1px)}
  .fcard:focus-visible{outline:3px solid var(--tone);outline-offset:2px}
  .fcard .fp{flex:1;background:var(--well);margin:7px;border-radius:5px;border:1px solid #05070b;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .fcard .ff{display:flex;gap:5px;align-items:center;padding:0 8px 8px}
  .fcard .fn{font-size:11px;font-weight:700;color:var(--ink-strong);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fcard .ftag{font-family:var(--mono);font-size:8px;text-transform:uppercase;color:var(--magenta);white-space:nowrap}
  .film-empty{flex:1;color:var(--ink-muted);font-size:13px;padding:20px 4px;text-align:center}
  .fnew{flex:0 0 82px;border:1px dashed var(--hairline-2);border-radius:9px;background:transparent;color:var(--ink-muted);display:flex;align-items:center;justify-content:center;font-size:23px;cursor:pointer;min-height:102px}
  .fnew:hover{border-color:var(--tone);color:var(--tone)}
  .fnew:focus-visible{outline:3px solid var(--tone);outline-offset:2px}

  /* ── platform lane ── */
  .tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:13px;margin-bottom:24px}

<script>
(function(){

       Combos        blocks/          — the chunk tier
       Pieces        elements/        — the six atoms
       Themes         tokens/frame-patches.json
       Interactions  presets.json :: interaction (recipes)

       Big number    stat         Line          divider
       Tag           badge        Picture       media

  const CONTAINERS=[
    {id:"les-tokens",  kind:"lesson",  name:"Tokens, end to end",          count:12, when:"2h ago"},
    {id:"gde-twilio",  kind:"guide",   name:"Twilio notification keys",     count:8,  when:"yesterday"},
    {id:"epi-neondrop",kind:"episode", name:"EffingAI · EP.04 Neon Drop",   count:14, when:"yesterday"},

  /* ── the shelves, in plain words ── */

    {k:"eyebrow",name:"Small label",  d:"the little line above a title"},

    {k:"badge",  name:"Tag",          d:"a small pill — draft, live, new"},

  ];
  const THEMES=[
    {k:"neubrutal",name:"Bold edges",  d:"hard outlines, offset shadow",       base:true},
    {k:"clay",     name:"Soft clay",   d:"rounded, pressed into the surface",  base:true},
    {k:"cyber",    name:"Neon glow",   d:"a lit edge — stacks on the others",  base:false},

  function layoutR(k,v){

    if(k==="title")m.innerHTML=`<div class="eb">${esc(v.eb||"episode")}</div><div class="h">${esc(t||"The stack, laid bare")}</div><div class="sub">${esc(v.cap||"what actually runs — and what it costs")}</div>`;
    else if(k==="big")m.innerHTML=`<div class="big">${esc(t||"128")}</div><div class="cap">${esc(v.cap||"tokens / query")}</div>`;
    else if(k==="quote")m.innerHTML=`<div class="quote">“${esc(t||"less, but better")}”</div><div class="rule"></div><div class="sub">${esc(v.cap||"Dieter Rams")}</div>`;
    else if(k==="compare")m.innerHTML=`<div class="bars"><div class="brow"><span class="bl">ours</span><span class="bt"><span class="bf" style="width:66%"></span></span></div><div class="brow"><span class="bl">theirs</span><span class="bt"><span class="bf alt" style="width:38%"></span></span></div></div>`;
    else if(k==="stats")m.innerHTML=`<div class="cells"><div class="c"><div class="v">128</div><div class="l">tokens</div></div><div class="c"><div class="v">24</div><div class="l">steps</div></div><div class="c"><div class="v">3</div><div class="l">packs</div></div></div>`;
    else if(k==="timeline")m.innerHTML=`<div class="tl"><span class="n"></span><span class="seg"></span><span class="n"></span><span class="seg"></span><span class="n off"></span><span class="seg"></span><span class="n off"></span></div>`;
    else if(k==="quiz")m.innerHTML=`<div class="quiz"><div class="qq">${esc(t||"Which layer runs first?")}</div><span class="opt hot">tokenizer</span><span class="opt">router</span><span class="opt">decoder</span></div>`;
    else if(k==="cost"){const C=2*Math.PI*32;m.innerHTML=`<svg class="arc" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="32" fill="none" stroke="var(--raised-2)" stroke-width="8"/><circle cx="40" cy="40" r="32" fill="none" stroke="var(--tone)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*0.32}"/></svg>`;m.style.alignItems="center";}
    else m.innerHTML=`<div class="h">${esc(t||"Card")}</div>`;
    return m;
  }
  function pieceR(k,v){
    v=v||{};
    if(k==="eyebrow")return el("div","r-eyebrow",v.text||"coldlight");
    if(k==="stat"){const d=el("div");d.style.textAlign="center";
      d.innerHTML=`<div style="font-weight:800;font-size:38px;color:var(--tone);line-height:1;font-variant-numeric:tabular-nums">${esc(v.value||"128")}</div><div style="font-size:12px;color:var(--ink)">${esc(v.label||"tokens")}</div>`;return d;}
    if(k==="badge"){const d=el("div","r-badges");d.innerHTML=`<span class="r-badge n">draft</span><span class="r-badge l"><span class="d"></span>live</span>`;return d;}
    if(k==="bar"){const d=el("div");d.style.width="80%";
      d.innerHTML=`<div style="height:14px;border-radius:999px;background:var(--raised-2)"><div style="height:100%;width:62%;border-radius:999px;background:var(--tone)"></div></div>`;return d;}
    if(k==="divider"){const d=el("div");d.style.cssText="width:84%;display:flex;align-items:center";
      d.innerHTML=`<span style="height:2px;width:18%;background:var(--tone);border-radius:2px"></span><span style="height:1px;flex:1;background:var(--hairline-2)"></span>`;return d;}
    if(k==="media"){const c=document.createElement("canvas");c.width=200;c.height=100;c.style.borderRadius="5px";
      const ctx=c.getContext("2d"),hex=TONES[v.tone||"cyan"];
      for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(100,50,11+i*12,0,7);ctx.strokeStyle=hex;ctx.globalAlpha=.5-i*.1;ctx.lineWidth=2;ctx.stroke();}
      return c;}
    return el("div","r-eyebrow","piece");
  }
  function themeR(k){
    const d=el("div");d.style.cssText="display:flex;align-items:center;justify-content:center";
    const s=el("div","swatch"+(k==="clay"?" clay":""));

  function renderItem(it,v){
    v=v||{};
    if(it.shelf==="pieces")return pieceR(it.k,v);
    if(it.shelf==="themes")return themeR(it.k);

  function shelfItems(id){
    const tag=(arr)=>arr.map(x=>Object.assign({},x,{shelf:id}));
    if(id==="starters")return tag(STARTERS);
    if(id==="layouts")return tag(LAYOUTS);
    if(id==="combos")return [];
    if(id==="pieces")return tag(PIECES);
    if(id==="themes")return tag(THEMES);
    return tag(INTERACTIONS);
  }

  /* ═══════ content lane — shelf picker + ONE carousel ═══════ */

  /* ── ONE carousel, big targets, sweepable ── */
  function buildCarousel(){
    const shelf=SHELVES.find(x=>x.id===S.shelf);
    const items=shelfItems(S.shelf);
    const wrap=el("div","carwrap");

    const head=el("div","carhead");
    const ct=el("span","ct");
    ct.innerHTML=`<b>${esc(shelf.name)}</b> — ${esc(shelf.sub)}. Tap one to drop it in.`;
    head.appendChild(ct);
    head.appendChild(el("span","sp"));
    const cnt=el("span","count");
    head.appendChild(cnt);
    const tg=el("label","toggle");
    tg.innerHTML=`<input type="checkbox"${S.endless?" checked":""}> keeps going`;
    tg.title="On: it never runs out — keep sweeping. Off: it stops at the end.";
    head.appendChild(tg);
    wrap.appendChild(head);

    const row=el("div","carrow");
    const left=el("button","arrow");left.type="button";left.textContent="‹";left.setAttribute("aria-label","Previous");
    const car=el("div","car");car.setAttribute("role","list");
    const right=el("button","arrow");right.type="button";right.textContent="›";right.setAttribute("aria-label","Next");
    row.append(left,car,right);
    wrap.append(row,el("div","caredge l"),el("div","caredge r"));

    if(!items.length){
      const e=el("div","emptyshelf");
      e.innerHTML=`<div class="et">Nothing here yet — and that's on purpose.</div>
        <div class="ed">A combo only shows up once you've used the same handful of pieces together on two or more cards. Until that happens this stays empty, rather than filling up with things nothing actually uses.</div>`;
      row.innerHTML="";row.appendChild(e);
      cnt.textContent="0 so far";
      wrap.querySelectorAll(".caredge").forEach(x=>x.remove());
      return wrap;
    }

    let page=0;
    const PER=8;
    function fill(){
      for(let i=0;i<PER;i++){
        const idx=page*PER+i;
        if(!S.endless&&idx>=items.length)break;
        const it=items[idx%items.length];
        car.appendChild(buildPick(it,idx));
      }
      page++;
      const shown=car.querySelectorAll(".pick").length;
      cnt.textContent=S.endless?`${shown} shown · keeps going`:`${shown} of ${items.length}`;
    }
    fill();fill();

    tg.querySelector("input").addEventListener("change",e=>{
      S.endless=e.target.checked;renderContent();
      toast(S.endless?"It'll keep going as you sweep":"It'll stop at the end now");
    });

    const step=()=>car.clientWidth*0.8;
    left.addEventListener("click",()=>car.scrollBy({left:-step()}));
    right.addEventListener("click",()=>{
      car.scrollBy({left:step()});
      if(S.endless&&car.scrollLeft+car.clientWidth*2>car.scrollWidth)fill();
    });
    car.addEventListener("scroll",()=>{
      left.disabled=car.scrollLeft<8;
      if(!S.endless)right.disabled=car.scrollLeft+car.clientWidth>=car.scrollWidth-8;
      else if(car.scrollLeft+car.clientWidth*2>car.scrollWidth)fill();
    });
    setTimeout(()=>{left.disabled=true;},0);

    /* drag to sweep — mouse and pen; touch scrolls natively */
    let down=false,x0=0,l0=0,moved=0;
    car.addEventListener("pointerdown",e=>{
      if(e.pointerType==="touch")return;
      down=true;moved=0;x0=e.clientX;l0=car.scrollLeft;car.classList.add("dragging");
    });
    car.addEventListener("pointermove",e=>{
      if(!down)return;
      const dx=e.clientX-x0;moved=Math.max(moved,Math.abs(dx));car.scrollLeft=l0-dx;
    });
    const up=()=>{down=false;car.classList.remove("dragging");};
    car.addEventListener("pointerup",up);
    car.addEventListener("pointerleave",up);
    car.addEventListener("click",e=>{if(moved>6)e.stopPropagation();},true);

    return wrap;
  }

  function buildPick(it,idx){
    const tone=TK[(idx*3+it.name.length)%TK.length];
    const b=el("button","pick");b.type="button";b.setAttribute("role","listitem");
    b.style.setProperty("--tone",TONES[tone]);
    b.style.setProperty("--tone-glow",hexA(TONES[tone],.22));
    const applies=(it.shelf==="themes"||it.shelf==="interactions");
    b.setAttribute("aria-label",(applies?"Apply ":"Add ")+it.name);
    const stage=el("div","stage");
    stage.appendChild(renderItem(it,{tone}));
    stage.appendChild(el("span","use",applies?"Use it":"Add it"));
    const meta=el("div","meta");
    meta.innerHTML=`<span class="pn">${esc(it.name)}</span><span class="pd">${esc(it.d)}</span>`;
    b.append(stage,meta);
    b.addEventListener("click",()=>{
      b.classList.remove("pulse");void b.offsetWidth;b.classList.add("pulse");
      if(applies){
        if(!S.cards.length){toast("Add a card first, then tap "+it.name+" to use it");return;}
        const last=S.cards[S.cards.length-1];
        if(it.shelf==="themes")last.theme=it.k;else last.recipe=it.k;
        renderStrip();toast(it.name+" — used on "+last.base);
      } else insertCard(it,tone);
    });
    return b;
  }

  function insertCard(it,tone){
    const c={id:"c"+S.cards.length+"-"+S.signals,base:it.name,shelf:it.shelf,k:it.k,
             tone:tone||"cyan",values:seedVals(it),quote:"",attrib:"",media:"",
             bg:null,motion:null,look:null,recipe:null};
    S.cards.push(c);
    if(S.container)S.container.count++;
    renderStrip();
    toast(signal("added “"+it.name+"”"));
    flagGap(1);
  }
  function seedVals(it){
    if(it.shelf==="layouts"||it.shelf==="starters")
      return {title:it.k==="big"?"128":it.k==="title"?"The stack, laid bare":"",
              cap:it.k==="big"?"tokens / query":"",tone:"cyan"};
    return {title:"",cap:"",tone:"cyan"};
  }

  function renderStrip(){
    const head=document.getElementById("stripHead"),film=document.getElementById("film");
    if(!head||!film||!S.container)return;
    head.innerHTML="";film.innerHTML="";
    const k=KINDS.find(x=>x.id===S.container.kind)||KINDS[0];
    const kp=el("span","kindpill",k.label);kp.style.setProperty("--k-tone",TONES[KIND_TONE[S.container.kind]||"cyan"]);
    head.appendChild(kp);
    const t=el("span","t");t.innerHTML=`<b>${esc(S.container.name)}</b> · ${S.cards.length} new ${k.unit}`;
    head.append(t,el("span","sp"));
    const ask=el("button","btn ai");ask.textContent="✦ Ask for help";
    ask.addEventListener("click",()=>openCard(S.cards[S.cards.length-1]||null,"ai"));
    const nw=el("button","btn tone");nw.textContent="＋ New card";
    nw.addEventListener("click",()=>openCard(null,"content"));
    head.append(ask,nw);

    if(!S.cards.length){
      film.appendChild(el("div","film-empty",`Tap something above to drop your first ${k.unit.replace(/s$/,"")} in here.`));
    } else {
      S.cards.forEach(c=>{
        const card=el("button","fcard");card.type="button";
        const tn=c.values.tone||c.tone||"cyan";

  function ladderSteps(){
    const steps=[],novel=S.mix.stack.length>=2,missing=S.mix.from.length===0;
    const names=S.mix.from.map(k=>(PIECES.find(p=>p.k===k)||{}).name).filter(Boolean);
    if(S.tier==="layout"||S.tier==="combo"){
      if(missing)steps.push({t:"Say what it's made of",e:"nothing picked yet — it can't be made of nothing",b:"wait"});
      else if(novel)steps.push({t:"Make the new pieces first",e:`your two extra themes changed these enough to need their own: ${names.join(" · ")}`,b:"auto"});
      else steps.push({t:"Use the pieces you already have",e:names.join(" · "),b:"done"});
    }
    if(S.tier==="layout")steps.push({t:"Add the layout",e:"shows up in Layouts the same day",b:missing?"wait":"auto"});
    if(S.tier==="combo")steps.push({t:"Add the combo",e:"shows up in Combos the same day",b:missing?"wait":"auto"});
    if(S.tier==="piece")steps.push({t:"Add the piece",e:"filed under the right shelf automatically",b:"auto"});
    if(S.tier==="theme")steps.push({t:"Add the look",e:"every surface can use it straight away",b:"auto"});
    if(S.tier==="interaction")steps.push({t:"Add the interaction",e:"made properly on its own before anything uses it",b:"auto"});
    if(novel&&(S.tier==="layout"||S.tier==="combo"))
      steps.push({t:"Make the variations",e:"one per starting look, so your mix works everywhere",b:"auto"});
    steps.push({t:"It joins the kit",e:"reusable from here on — nothing one-off, nothing wired by hand",
                b:(missing&&(S.tier==="layout"||S.tier==="combo"))?"wait":"auto"});
    return steps;
  }
  function buildLadder(){
    const l=el("div","ladder");
    l.appendChild(el("div","lh","In this order — nothing skipped"));
    ladderSteps().forEach((st,i)=>{
      const r=el("div","rung");
      r.innerHTML=`<span class="no">${i+1}</span><span class="body"><span class="rt"><b>${esc(st.t)}</b><span class="ent">${esc(st.e)}</span></span></span><span class="badge ${st.b}">${st.b==="auto"?"automatic":st.b==="done"?"reused":"needs you"}</span>`;
      l.appendChild(r);
    });
    return l;
  }
  function refreshComposer(){
    const stage=document.getElementById("mixStage");
    if(!stage)return;
    stage.innerHTML="";
    const card=el("div");
    card.style.cssText="width:min(340px,100%);aspect-ratio:16/9;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;overflow:hidden;padding:16px";
    const clay=S.mix.base==="clay";
    card.style.background=clay?"linear-gradient(145deg,#1d2534,#0d1119)":"var(--raised)";
    card.style.border="1px solid var(--hairline-2)";
    card.style.boxShadow=clay
      ? "inset 4px 4px 11px rgba(255,255,255,.14),inset -4px -4px 11px rgba(0,0,0,.5)"
      : "6px 6px 0 rgba(0,0,0,.55)";
    if(S.mix.stack.includes("cyber"))card.style.boxShadow+=",0 0 28px var(--tone-glow)";
    if(S.mix.stack.includes("retro")){
      const sc=el("div");
      sc.style.cssText="position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(40,224,208,.09) 0 1px,transparent 1px 4px)";
      card.appendChild(sc);
    }
    if(!S.mix.from.length){
      const e=el("div");e.style.cssText="font-size:13px;color:var(--ink-muted)";
      e.textContent="tap what it's made of →";card.appendChild(e);
    } else {
      S.mix.from.forEach(k=>{
        const h=el("div");h.style.cssText="display:flex;align-items:center;justify-content:center";
        h.appendChild(pieceR(k,{tone:"cyan"}));card.appendChild(h);
      });
    }
    stage.appendChild(card);
    const comp=stage.closest(".composer");
    if(comp){const old=comp.querySelector(".ladder");if(old)old.replaceWith(buildLadder());}
    document.querySelectorAll(".mix").forEach(b=>{
      const t=b.textContent;
      const lk=THEMES.find(l=>l.name===t),pc=PIECES.find(p=>p.name===t);
      if(lk)b.setAttribute("aria-pressed",String(lk.base?S.mix.base===lk.k:S.mix.stack.includes(lk.k)));
      if(pc)b.setAttribute("aria-pressed",String(S.mix.from.includes(pc.k)));
    });
  }
  function runLadder(){
    const rungs=[...document.querySelectorAll(".rung")];
    if(rungs.some(r=>r.querySelector(".badge.wait"))){
      toast("Say what it's made of first — that step can't be skipped");return;
    }
    rungs.forEach((r,i)=>setTimeout(()=>{
      r.classList.add("run");
      setTimeout(()=>{r.classList.remove("run");r.classList.add("done");},260);
      if(i===rungs.length-1){
        const T=TIERS.find(t=>t.id===S.tier);
        const key=S.tier==="piece"?"pieces":S.tier==="combo"?"combos":S.tier==="theme"?"themes":S.tier==="interaction"?"interactions":"layouts";
        const novel=S.mix.stack.length>=2&&(S.tier==="layout"||S.tier==="combo");
        if(novel)S.lib.pieces+=S.mix.from.length;
        S.lib[key]++;
        toastGrow(signal("added "+T.n.toLowerCase())+(novel?` — and made ${S.mix.from.length} pieces first`:""));
      }
    },i*300));
  }

  function openCard(card,tab){

  function optionPicker(groups,getOpts,paint,onPick,getCur){
    const holder=el("div");

      const opts=getOpts(g);grid.innerHTML="";

        const b=el("button","opt");b.type="button";b.setAttribute("aria-label",o.name);
        const cur=getCur&&getCur();

        b.addEventListener("click",()=>{

          toast(o.name);

       {t:"Then make the card",e:"putting all three together"}
      ].forEach((st,i)=>{
        const r=el("div","rung");r.id="ask"+i;
        r.innerHTML=`<span class="no">${i+1}</span><span class="body"><span class="rt"><b>${esc(st.t)}</b><span class="ent">${esc(st.e)}</span></span></span>`;
        lad.appendChild(r);
      });
      main.appendChild(lad);
    }
  }
  function runAsk(e,want){
    if(!assistOn){toast("Turn help on first — or copy the wording and paste it into chat");return;}
    if(!want){S.lib.layouts++;toast(signal("made the card"));return;}
    [0,1,2,3].forEach(i=>setTimeout(()=>{
      const r=document.getElementById("ask"+i);
      if(r)r.classList.add("done");
      if(i===0)S.lib.pieces+=2;
      if(i===1)S.lib.layouts++;
      if(i===2){
        S.lib.interactions++;
        const sp=INTERACTIONS.find(x=>x.k===want.k);if(sp)sp.have=true;
        toastGrow(signal("built “"+want.name+"” — yours to reuse from now on"));
      }
      if(i===3){e.recipe=want.k;e._want=null;renderCardTab();}
    },260+i*340));
  }

  /* ═══════ modal plumbing ═══════ */
  const backdrop=document.getElementById("backdrop"),
        modal=document.getElementById("modal"),
        mBody=document.getElementById("mBody"),
        mFoot=document.getElementById("mFoot");
  let lastFocus=null;
  function openModal(cfg){
    lastFocus=document.activeElement;
    document.getElementById("mTitle").textContent=cfg.title;
    document.getElementById("mSub").textContent=cfg.sub||"";
    modal.classList.toggle("narrow",!!cfg.narrow);
    mBody.innerHTML="";mFoot.innerHTML="";
    if(cfg.tabs){
      const tabs=el("div","tabs");
      cfg.tabs.forEach(([id,label,ic])=>{
        const t=el("button","tab");t.type="button";t.dataset.tab=id;
        t.setAttribute("aria-selected",String(id===activeTab));
        t.innerHTML=`<span class="ic" aria-hidden="true">${ic}</span>${esc(label)}`+(id==="ai"?'<span class="bdg">AI</span>':"");
        t.addEventListener("click",()=>{
          tabs.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected","false"));
          t.setAttribute("aria-selected","true");
          cfg.onTab&&cfg.onTab(id);
        });
        tabs.appendChild(t);
      });
      mBody.appendChild(tabs);
    }
    if(cfg.live){
      const split=el("div","m-split");
      const main=el("div","m-main");main.id="mMain";
      const live=el("div","m-live");
      live.innerHTML='<div class="lvh"><span class="led"></span>as it looks right now</div>';
      const lc=el("div","livecard");lc.id="liveCard";
      live.appendChild(lc);
      const meta=el("div","hint");meta.id="liveMeta";meta.style.margin="0";
      live.appendChild(meta);
      split.append(main,live);mBody.appendChild(split);
    } else {
      const main=el("div","m-main");main.id="mMain";main.style.flex="1";
      mBody.appendChild(main);
    }
    cfg.body&&cfg.body(document.getElementById("mMain"));
    cfg.foot&&cfg.foot(mFoot);
    backdrop.classList.add("open");
    const first=mBody.querySelector("input,button,select,textarea");
    if(first)first.focus();
  }
  function closeModal(){
    backdrop.classList.remove("open");editing=null;
    if(lastFocus&&lastFocus.focus)lastFocus.focus();
  }
  document.getElementById("mClose").addEventListener("click",closeModal);
  backdrop.addEventListener("click",ev=>{if(ev.target===backdrop)closeModal();});
  addEventListener("keydown",ev=>{
    if(ev.key==="Escape"&&backdrop.classList.contains("open"))closeModal();
    if(ev.key==="Tab"&&backdrop.classList.contains("open")){
      const f=[...modal.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
      if(!f.length)return;
      const a=f[0],z=f[f.length-1];
      if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();z.focus();}
      else if(!ev.shiftKey&&document.activeElement===z){ev.preventDefault();a.focus();}
    }
  });

  function fText(label,val,on,ph,suggest){
    const w=el("div","field"),lab=el("div","f-label");
    lab.innerHTML=`<span>${esc(label)}</span>`;
    if(suggest){
      const s=el("span","sug","try “"+suggest+"”");
      s.setAttribute("role","button");s.tabIndex=0;
      const apply=()=>{i.value=suggest;on(suggest);toast("Filled in");};
      s.addEventListener("click",apply);
      s.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();apply();}});
      lab.appendChild(s);
    }
    w.appendChild(lab);
    const i=el("input","f-in");i.value=val||"";i.placeholder=ph||"";
    i.addEventListener("input",()=>on(i.value));
    w.appendChild(i);
    return w;
  }
  function fTone(e){
    const w=el("div","field");
    w.innerHTML='<div class="f-label"><span>Feel</span><span style="color:var(--ink-muted)">colour that means something</span></div>';
    const box=el("div","tones");
    TK.forEach(k=>{
      const b=el("button","tone-chip");b.type="button";b.style.color=TONES[k];
      b.setAttribute("aria-label",MEANS[k]);
      b.setAttribute("aria-pressed",String((e.values.tone||"cyan")===k));
      b.innerHTML=`<span class="sw" style="background:${TONES[k]}"></span>`;
      b.addEventListener("click",()=>{
        e.values.tone=k;
        box.querySelectorAll(".tone-chip").forEach((c,i)=>c.setAttribute("aria-pressed",String(TK[i]===k)));
        renderLive();
      });
      box.appendChild(b);
    });
    w.appendChild(box);
    return w;
  }
  const note=t=>el("div","hint",t);
  function statusLine(t){
    const s=el("span","status");
    s.innerHTML=`<span class="chk">✓</span>${esc(t)}`;
    return s;
  }

  let tt=null;
  const toastEl=document.getElementById("toast");
  function toast(m){toastEl.className="toast show";toastEl.textContent=m;clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),1900);}
  function toastGrow(m){toastEl.className="toast grow show";toastEl.textContent="✓ "+m;clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),2600);}

  go("dashboard");
})();
</script>

</body></html>
